business_rules:
  - id: BR-001
    title: Уникальность источника телеметрии
    rule: Каждый источник телеметрии должен иметь уникальный внешний идентификатор независимо от статуса.
    applies_to:
      - TelemetrySource
    exceptions:
      - Повторная регистрация уже известного источника должна обновлять существующую запись, а не создавать новый источник.

  - id: BR-002
    title: Приём только от активных источников
    rule: Метрики принимаются к обработке только от источников со статусом ACTIVE.
    applies_to:
      - TelemetrySource
      - MetricSample
    exceptions:
      - Администратор может временно разрешить приём от источника в статусе INACTIVE для восстановления после сбоя.

  - id: BR-003
    title: Обязательные поля метрики
    rule: Каждое измерение должно содержать определение метрики, источник, числовое значение и время измерения.
    applies_to:
      - MetricSample
      - MetricDefinition
      - TelemetrySource
    exceptions:
      - Невалидное измерение может быть сохранено только как ProcessingFailure для диагностики.

  - id: BR-004
    title: Измерение не может ссылаться на отключённую метрику
    rule: Новые измерения не принимаются для MetricDefinition в статусе DISABLED.
    applies_to:
      - MetricDefinition
      - MetricSample
    exceptions:
      - Повторная обработка исторических данных может использовать определение, которое было активно на момент исходного приёма.

  - id: BR-005
    title: Неизменность исходного измерения
    rule: После успешного приёма исходное значение MetricSample, время измерения и источник не должны изменяться.
    applies_to:
      - MetricSample
    exceptions:
      - Коррекция допускается только путём создания нового измерения или отдельной записи о проблеме обработки.

  - id: BR-006
    title: Время измерения не позже времени приёма сверх допустимого допуска
    rule: Время измерения не должно быть существенно позже времени приёма системой.
    applies_to:
      - MetricSample
    exceptions:
      - Если отклонение не превышает настроенный допуск на рассинхронизацию часов, измерение принимается как VALID.
      - Если отклонение превышает допуск, измерение помечается как SUSPECT или изолируется для диагностики.

  - id: BR-007
    title: Поздние измерения
    rule: Измерение, пришедшее позже допустимого окна задержки, не должно изменять уже опубликованные оперативные значения.
    applies_to:
      - MetricSample
      - TimeSeries
      - MetricAggregate
    exceptions:
      - Позднее измерение может быть учтено в исторической аналитике или при явной повторной обработке.

  - id: BR-008
    title: Разрешённые метки
    rule: Если для MetricDefinition задан список allowedLabelKeys, измерение может содержать только эти пользовательские метки.
    applies_to:
      - MetricDefinition
      - TimeSeries
      - MetricSample
    exceptions:
      - Служебные метки системы могут добавляться независимо от пользовательского списка разрешённых меток.

  - id: BR-009
    title: Стабильность временного ряда
    rule: Временной ряд однозначно определяется определением метрики, источником и нормализованным набором меток.
    applies_to:
      - TimeSeries
      - MetricDefinition
      - TelemetrySource
    exceptions:
      - Изменение набора меток создаёт новый временной ряд.

  - id: BR-010
    title: Последнее значение временного ряда
    rule: Последним значением временного ряда считается измерение с максимальным временем измерения среди валидных измерений ряда.
    applies_to:
      - TimeSeries
      - MetricSample
    exceptions:
      - Измерение с качеством SUSPECT не заменяет последнее значение до подтверждения или повторной обработки.

  - id: BR-011
    title: Идемпотентность повторной доставки измерений
    rule: Повторная доставка одного и того же измерения не должна создавать отличающийся доменный результат.
    applies_to:
      - MetricSample
      - TimeSeries
      - MetricAggregate
      - AlertEvent
    exceptions:
      - Повторная доставка может увеличивать технические счётчики диагностики, но не бизнес-результаты обработки.

  - id: BR-012
    title: Валидность окна агрегации
    rule: Окно агрегации должно иметь положительную длительность, а его начало должно предшествовать окончанию.
    applies_to:
      - AggregationPolicy
      - MetricAggregate
    exceptions: []

  - id: BR-013
    title: Агрегация только по совместимым функциям
    rule: Функция агрегации должна быть совместима с типом значения и смыслом метрики.
    applies_to:
      - AggregationPolicy
      - MetricDefinition
      - MetricAggregate
    exceptions:
      - Администратор может сохранить неактивную политику агрегации до исправления несовместимых настроек.

  - id: BR-014
    title: Агрегат не может быть рассчитан без исходных данных
    rule: MetricAggregate должен иметь sampleCount больше нуля.
    applies_to:
      - MetricAggregate
    exceptions: []

  - id: BR-015
    title: Активное правило алертинга должно быть полным
    rule: AlertRule в статусе ACTIVE должен иметь метрику, оператор сравнения, порог, окно оценки и уровень важности.
    applies_to:
      - AlertRule
    exceptions:
      - Неполное правило может быть сохранено только в статусе DISABLED.

  - id: BR-016
    title: Неактивное правило не создаёт алерты
    rule: AlertRule в статусе DISABLED не участвует в оценке метрик и не создаёт новые Alert или AlertEvent.
    applies_to:
      - AlertRule
      - Alert
      - AlertEvent
    exceptions:
      - Существующие алерты по отключённому правилу могут быть переведены системой в RESOLVED согласно политике завершения.

  - id: BR-017
    title: Переходы состояний алерта
    rule: Состояние Alert может изменяться только по допустимым переходам NORMAL -> PENDING -> FIRING -> RESOLVED -> NORMAL.
    applies_to:
      - Alert
      - AlertEvent
    exceptions:
      - При первом обнаружении нарушения состояние может быть создано сразу как PENDING.
      - При явном сбросе администратором состояние может быть переведено из FIRING в RESOLVED.

  - id: BR-018
    title: Событие алертинга только при изменении состояния
    rule: AlertEvent создаётся только при фактическом изменении состояния Alert.
    applies_to:
      - Alert
      - AlertEvent
    exceptions:
      - Система может создавать технические события повторной доставки, не являющиеся AlertEvent предметной области.

  - id: BR-019
    title: Сохранение истории алертинга
    rule: AlertEvent не должен изменяться после создания.
    applies_to:
      - AlertEvent
    exceptions:
      - Исправление ошибочного события допускается только через новое компенсирующее событие.

  - id: BR-020
    title: Изоляция проблемных данных
    rule: Данные, которые невозможно обработать после допустимого числа попыток, должны быть изолированы как ProcessingFailure.
    applies_to:
      - ProcessingFailure
    exceptions:
      - Если ошибка признана несущественной политикой обработки, данные могут быть помечены как IGNORED.

  - id: BR-021
    title: Проблемные данные не блокируют обработку
    rule: ProcessingFailure не должен останавливать обработку других независимых данных.
    applies_to:
      - ProcessingFailure
    exceptions: []

  - id: BR-022
    title: Повторная обработка только доступных данных
    rule: ReplayJob может быть запущен только для диапазона данных, который доступен системе.
    applies_to:
      - ReplayJob
    exceptions:
      - Администратор может запустить частичную повторную обработку после явного подтверждения неполного диапазона.

  - id: BR-023
    title: Завершение задания повторной обработки
    rule: Завершённый ReplayJob должен содержать итоговые счётчики обработанных и ошибочных данных.
    applies_to:
      - ReplayJob
    exceptions: []

  - id: BR-024
    title: Защита административных операций
    rule: Управление источниками, правилами алертинга, проблемными данными и повторной обработкой доступно только авторизованным субъектам с административными правами.
    applies_to:
      - TelemetrySource
      - AlertRule
      - ProcessingFailure
      - ReplayJob
    exceptions: []

  - id: BR-025
    title: Разделение чтения и управления
    rule: Право читать метрики не даёт права изменять определения метрик, правила алертинга или запускать повторную обработку.
    applies_to:
      - MetricDefinition
      - AlertRule
      - ReplayJob
    exceptions:
      - Сервисный субъект может совмещать права чтения и управления, если это явно разрешено политикой доступа.

  - id: BR-026
    title: Регистрация только через административную операцию
    rule: Регистрация источника выполняется только аутентифицированным субъектом с административными правами управления источниками; отправка метрик не создаёт источник автоматически.
    applies_to:
      - TelemetrySource
    exceptions:
      - Автоматизированный provisioning допустим от имени сервисного субъекта с явно выданными административными правами управления источниками.

  - id: BR-027
    title: Стабильность идентичности при повторной регистрации
    rule: Повторная регистрация с тем же externalId обновляет только name и переданные attributes; id, externalId, type, status, registeredAt и lastSeenAt сохраняются. Попытка изменить type отклоняется. Отсутствие attributes в запросе не удаляет существующие атрибуты.
    applies_to:
      - TelemetrySource
    exceptions: []

  - id: BR-028
    title: Начальное состояние зарегистрированного источника
    rule: Новый источник регистрируется в статусе ACTIVE; registeredAt задаётся системой, lastSeenAt остаётся пустым до приёма валидной телеметрии. Регистрация сама по себе не подтверждает работоспособность источника и не выдаёт отправителю права на передачу метрик.
    applies_to:
      - TelemetrySource
    exceptions: []

  - id: BR-029
    title: Привязка отправителя к источнику
    rule: Аутентифицированный отправитель может передавать метрики только от имени источников, на которые ему явно предоставлено соответствующее разрешение; идентификатор источника не является учётными данными.
    applies_to:
      - TelemetrySource
      - MetricSample
    exceptions: []
