business_rules:
  - id: BR-001
    title: Уникальность источника телеметрии
    rule: Каждый источник телеметрии должен иметь уникальный внешний идентификатор независимо от статуса.
    applies_to:
      - TelemetrySource
    exceptions:
      - Повторная регистрация уже известного источника должна обновлять существующую запись, а не создавать новый источник.

  - id: BR-002
    title: Приём только от активных источников
    rule: Метрики принимаются к обработке только от источников со статусом ACTIVE.
    applies_to:
      - TelemetrySource
      - MetricSample
    exceptions:
      - Администратор может временно разрешить приём от источника в статусе INACTIVE для восстановления после сбоя.

  - id: BR-003
    title: Обязательные поля метрики
    rule: Каждое измерение должно содержать определение метрики, источник, числовое значение, время измерения и стабильный measurementId, созданный агентом.
    applies_to:
      - MetricSample
      - MetricDefinition
      - TelemetrySource
    exceptions:
      - Невалидное измерение может быть сохранено только как ProcessingFailure для диагностики.

  - id: BR-004
    title: Измерение не может ссылаться на отключённую метрику
    rule: Новые измерения не принимаются для MetricDefinition в статусе DISABLED.
    applies_to:
      - MetricDefinition
      - MetricSample
    exceptions:
      - Повторная обработка исторических данных может использовать определение, которое было активно на момент исходного приёма.

  - id: BR-005
    title: Неизменность исходного измерения
    rule: После успешного приёма исходное значение MetricSample, время измерения и источник не должны изменяться.
    applies_to:
      - MetricSample
    exceptions:
      - Коррекция допускается только путём создания нового измерения или отдельной записи о проблеме обработки.

  - id: BR-006
    title: Время измерения не позже времени приёма сверх допустимого допуска
    rule: Время измерения не должно быть существенно позже времени приёма системой.
    applies_to:
      - MetricSample
    exceptions:
      - Если отклонение не превышает настроенный допуск на рассинхронизацию часов, измерение принимается как VALID.
      - Если отклонение превышает допуск, измерение помечается как SUSPECT или изолируется для диагностики.

  - id: BR-007
    title: Поздние измерения
    rule: Измерение, пришедшее позже допустимого окна задержки, не должно изменять уже опубликованные оперативные значения.
    applies_to:
      - MetricSample
      - TimeSeries
      - MetricAggregate
    exceptions:
      - Позднее измерение может быть учтено в исторической аналитике или при явной повторной обработке.

  - id: BR-008
    title: Разрешённые метки
    rule: Если для MetricDefinition задан список allowedLabelKeys, измерение может содержать только эти пользовательские метки.
    applies_to:
      - MetricDefinition
      - TimeSeries
      - MetricSample
    exceptions:
      - Служебные метки системы могут добавляться независимо от пользовательского списка разрешённых меток.

  - id: BR-009
    title: Стабильность временного ряда
    rule: Временной ряд однозначно определяется определением метрики, источником и нормализованным набором меток.
    applies_to:
      - TimeSeries
      - MetricDefinition
      - TelemetrySource
    exceptions:
      - Изменение набора меток создаёт новый временной ряд.

  - id: BR-010
    title: Последнее значение временного ряда
    rule: Последним значением временного ряда считается измерение с максимальным временем измерения среди валидных измерений ряда.
    applies_to:
      - TimeSeries
      - MetricSample
    exceptions:
      - Измерение с качеством SUSPECT не заменяет последнее значение до подтверждения или повторной обработки.

  - id: BR-011
    title: Идемпотентность повторной доставки измерений
    rule: Агент создаёт уникальный measurementId для каждой точки и сохраняет его при повторной отправке. Тот же ID с тем же исходным содержимым при доставке и replay не создаёт второй доменный результат; тот же ID с отличающимся содержимым является конфликтом и не заменяет первоначальную точку. Разные ID не объединяются только из-за совпадения ряда, времени и значения.
    applies_to:
      - MetricSample
      - TimeSeries
      - MetricAggregate
      - AlertEvent
    exceptions:
      - Повторная доставка может увеличивать технические счётчики диагностики, но не бизнес-результаты обработки.
      - Подтверждение Ingestion означает надёжную запись в Kafka, а не завершённую проверку конфликта или сохранение в истории.

  - id: BR-012
    title: Валидность окна агрегации
    rule: Длительность окна AggregationPolicy должна составлять 60, 300 или 3600 секунд (1 минута, 5 минут или 1 час); начало окна MetricAggregate должно предшествовать окончанию, а длительность результата должна соответствовать политике. Это правило не задаёт время закрытия окна и допустимое опоздание точек.
    applies_to:
      - AggregationPolicy
      - MetricAggregate
    exceptions: []

  - id: BR-013
    title: Агрегация только по совместимым функциям
    rule: Функция агрегации должна быть совместима с типом значения и смыслом метрики.
    applies_to:
      - AggregationPolicy
      - MetricDefinition
      - MetricAggregate
    exceptions:
      - Администратор может сохранить неактивную политику агрегации до исправления несовместимых настроек.

  - id: BR-014
    title: Агрегат не может быть рассчитан без исходных данных
    rule: MetricAggregate должен иметь sampleCount больше нуля.
    applies_to:
      - MetricAggregate
    exceptions: []

  - id: BR-015
    title: Активное правило алертинга должно быть полным
    rule: AlertRule в статусе ACTIVE должен иметь метрику, оператор сравнения, порог, окно оценки и уровень важности.
    applies_to:
      - AlertRule
    exceptions:
      - Неполное правило может быть сохранено только в статусе DISABLED.

  - id: BR-016
    title: Неактивное правило не создаёт алерты
    rule: AlertRule в статусе DISABLED не участвует в оценке метрик и не создаёт новые Alert или AlertEvent.
    applies_to:
      - AlertRule
      - Alert
      - AlertEvent
    exceptions:
      - Существующие алерты по отключённому правилу могут быть переведены системой в RESOLVED согласно политике завершения.

  - id: BR-017
    title: Переходы состояний алерта
    rule: Допустимы переходы NORMAL -> PENDING, PENDING -> NORMAL (нарушение исчезло до истечения pendingPeriod), PENDING -> FIRING, FIRING -> RESOLVED и RESOLVED -> NORMAL. При новом нарушении после завершения периода подавления допустим RESOLVED -> PENDING. Переход создаётся только по результату разрешённой оценки или явного действия, а не только из-за отсутствия новых точек.
    applies_to:
      - Alert
      - AlertEvent
    exceptions:
      - При первом обнаружении нарушения состояние может быть создано сразу как PENDING.
      - При явном сбросе администратором состояние может быть переведено из FIRING в RESOLVED.
      - При отключении правила допускается PENDING -> RESOLVED по BR-016.

  - id: BR-018
    title: Событие алертинга только при изменении состояния
    rule: AlertEvent создаётся только при фактическом изменении состояния Alert.
    applies_to:
      - Alert
      - AlertEvent
    exceptions:
      - Система может создавать технические события повторной доставки, не являющиеся AlertEvent предметной области.

  - id: BR-019
    title: Сохранение истории алертинга
    rule: AlertEvent не должен изменяться после создания.
    applies_to:
      - AlertEvent
    exceptions:
      - Исправление ошибочного события допускается только через новое компенсирующее событие.

  - id: BR-020
    title: Изоляция проблемных данных
    rule: Данные, которые невозможно обработать после допустимого числа попыток, должны быть изолированы как ProcessingFailure.
    applies_to:
      - ProcessingFailure
    exceptions:
      - Если ошибка признана несущественной политикой обработки, данные могут быть помечены как IGNORED.
      - Конфликт measurementId с отличающимся исходным содержимым изолируется сразу без бесполезных автоматических повторов (BR-033).

  - id: BR-021
    title: Проблемные данные не блокируют обработку
    rule: ProcessingFailure не должен останавливать обработку других независимых данных.
    applies_to:
      - ProcessingFailure
    exceptions: []

  - id: BR-022
    title: Повторная обработка только доступных данных
    rule: ReplayJob может быть запущен только для диапазона данных, который доступен системе.
    applies_to:
      - ReplayJob
    exceptions:
      - Администратор может запустить частичную повторную обработку после явного подтверждения неполного диапазона.

  - id: BR-023
    title: Завершение задания повторной обработки
    rule: Завершённый ReplayJob должен содержать итоговые счётчики обработанных и ошибочных данных.
    applies_to:
      - ReplayJob
    exceptions: []

  - id: BR-024
    title: Защита административных операций
    rule: Управление источниками, правилами алертинга, алертами, проблемными данными и повторной обработкой доступно только авторизованным субъектам с административными правами.
    applies_to:
      - TelemetrySource
      - AlertRule
      - Alert
      - ProcessingFailure
      - ReplayJob
    exceptions: []

  - id: BR-025
    title: Разделение чтения и управления
    rule: Право читать метрики не даёт права изменять определения метрик, правила алертинга или запускать повторную обработку.
    applies_to:
      - MetricDefinition
      - AlertRule
      - ReplayJob
    exceptions:
      - Сервисный субъект может совмещать права чтения и управления, если это явно разрешено политикой доступа.

  - id: BR-026
    title: Регистрация только через административную операцию
    rule: Регистрация источника выполняется только аутентифицированным субъектом с административными правами управления источниками; отправка метрик не создаёт источник автоматически.
    applies_to:
      - TelemetrySource
    exceptions:
      - Автоматизированный provisioning допустим от имени сервисного субъекта с явно выданными административными правами управления источниками.

  - id: BR-027
    title: Стабильность идентичности при повторной регистрации
    rule: Повторная регистрация с тем же externalId обновляет только name и переданные attributes; id, externalId, type, status, registeredAt и lastSeenAt сохраняются. Попытка изменить type отклоняется. Отсутствие attributes в запросе не удаляет существующие атрибуты.
    applies_to:
      - TelemetrySource
    exceptions: []

  - id: BR-028
    title: Начальное состояние зарегистрированного источника
    rule: Новый источник регистрируется в статусе ACTIVE; registeredAt задаётся системой, lastSeenAt остаётся пустым до приёма валидной телеметрии. Регистрация сама по себе не подтверждает работоспособность источника и не выдаёт отправителю права на передачу метрик.
    applies_to:
      - TelemetrySource
    exceptions: []

  - id: BR-029
    title: Привязка отправителя к источнику
    rule: Аутентифицированный отправитель может передавать метрики только от имени источников, на которые ему явно предоставлено соответствующее разрешение; идентификатор источника не является учётными данными.
    applies_to:
      - TelemetrySource
      - MetricSample
    exceptions: []

  - id: BR-030
    title: Результат пакетного приёма
    rule: Ответ на разобранный пакет содержит списки подтверждённо принятых точек и точек без подтверждения приёма. Каждая позиция исходного пакета представлена ровно в одном списке; принятая точка подтверждается только после надёжной фиксации. Второй список содержит причину (включая неизвестный результат записи) и указание на возможность повтора; попадание в него не доказывает отсутствие точки в буфере. Каждый результат содержит позицию точки и, если он корректен, её measurementId.
    applies_to:
      - MetricSample
    exceptions:
      - При ошибке авторизации или невозможности разобрать пакет целиком запрос отклоняется без поэлементного ответа.
      - При неизвестном результате записи точка помещается во второй список как неподтверждённая, без утверждения, что она отклонена системой; агент повторяет её с прежним ID.

  - id: BR-031
    title: Удаление полного исходника после архивирования
    rule: Полная исходная точка хранится в ClickHouse одни сутки от receivedAt, затем в MinIO на срок отдельной политики архива. Удаление из ClickHouse допустимо только после проверки полноты и контрольной суммы соответствующего RAW_SAMPLES-архива и подтверждения его каталога; агрегаты не заменяют архив исходных точек.
    applies_to:
      - MetricSample
    exceptions:
      - При сбое архивирования исходные точки остаются в ClickHouse дольше суток до успешного подтверждения полного архива.

  - id: BR-032
    title: Атомарность перехода и публикация события алерта
    rule: Изменения одного Alert сериализуются блокировкой его строки в транзакции PostgreSQL; после получения блокировки актуальное состояние перечитывается и решение о переходе пересчитывается. При фактическом переходе изменение Alert, создание неизменяемого AlertEvent и запись outbox для публикации сохраняются в этой же транзакции. Идентификатор AlertEvent.id используется как eventId и сохраняется при каждой попытке публикации; подтверждение ручного сброса допускается только после фиксации этой транзакции и не означает доставку в Kafka или внешнему получателю.
    applies_to:
      - Alert
      - AlertEvent
    exceptions:
      - Если перехода состояния не произошло, AlertEvent и запись outbox не создаются.
      - Проигравшая в гонке операция оценивает состояние заново и не сохраняет переход из устаревшего состояния.

  - id: BR-033
    title: Проверка конфликтов измерений после приёма
    rule: При последующей обработке исходной точки проверяется measurementId и исходное содержимое (источник, исходные имя метрики, значение, единица при наличии, observedAt и пользовательские метки) до создания или изменения истории MetricSample, latest, агрегатов и алертов. receivedAt, eventId и correlationId не участвуют в сравнении. Повтор с тем же содержимым не создаёт нового доменного эффекта; отличающееся содержимое с тем же ID изолируется как ProcessingFailure с причиной конфликта и ссылкой на точку, без изменения первоначальной точки и downstream-результатов.
    applies_to:
      - MetricSample
      - MetricAggregate
      - AlertEvent
      - ProcessingFailure
    exceptions:
      - Если конфликт обнаружен до ответа агента, точка может быть указана во втором списке результатов; обязательная синхронная проверка в Ingestion не требуется.

  - id: BR-034
    title: Отсутствие данных не закрывает алерт
    rule: Отсутствие новых измерений само по себе не переводит существующий Alert в RESOLVED или NORMAL и не создаёт AlertEvent о восстановлении. Последнее состояние сохраняется до разрешённой оценки нового факта или ручного действия.
    applies_to:
      - Alert
      - AlertEvent
    exceptions: []

  - id: BR-035
    title: Подавление повторного срабатывания после ручного сброса
    rule: При ручном переходе FIRING -> RESOLVED для данного Alert в той же транзакции фиксируется suppressedUntil по настроенному у AlertRule положительному manualResetSuppressionPeriod. До suppressedUntil автоматическая оценка не инициирует повторное срабатывание этого алерта. По истечении периода только новая обычная оценка актуальных данных может начать переход RESOLVED -> PENDING; окончание таймера само по себе не создаёт переход или AlertEvent.
    applies_to:
      - AlertRule
      - Alert
      - AlertEvent
    exceptions:
      - Подавление не отключает правило и не останавливает приём или хранение метрик.

  - id: BR-036
    title: Replay без изменения состояния и истории алертов
    rule: ReplayJob повторно обрабатывает доступные исходные данные для истории и агрегатов, но не изменяет действующий Alert, не создаёт и не исправляет AlertEvent и outbox и не публикует повторных алертов из-за переоценки исторических метрик.
    applies_to:
      - ReplayJob
      - Alert
      - AlertEvent
    exceptions:
      - Обычная повторная доставка уже сохранённого AlertStateChanged из outbox сохраняет исходный eventId и не является replay исходных метрик.

  - id: BR-037
    title: Промежуточная сумма среднего агрегата
    rule: Для MetricAggregate с функцией AVG поле sum обязательно и содержит сумму значений исходных точек, sampleCount содержит их количество больше нуля, а value вычисляется как sum / sampleCount. Для остальных функций sum отсутствует; для SUM результат суммы хранится в value. При объединении агрегатов AVG складываются sum и sampleCount, а не готовые значения AVG. Правила точности и округления результата требуют отдельного определения.
    applies_to:
      - MetricAggregate
    exceptions: []
