requirements:
  - id: FR-001
    title: Приём метрик
    description: Система должна принимать системные и прикладные метрики от источников телеметрии.
    actor: Источник телеметрии
    priority: must
    acceptance_criteria:
      - Источник может передать одну метрику или пакет метрик.
      - Каждая метрика содержит имя, числовое значение и временную метку.
      - Метрика может содержать произвольный набор разрешённых меток.
      - Система подтверждает приём только после надёжной фиксации данных.

  - id: FR-002
    title: Идентификация источника
    description: Система должна связывать каждую принятую метрику с её источником.
    actor: Агент
    priority: must
    acceptance_criteria:
      - Для каждой метрики определён идентификатор хоста или микросервиса.
      - Метрика без идентификатора источника отклоняется как невалидная.
      - Идентификатор источника сохраняется при обработке и записи в хранилища.

  - id: FR-003
    title: Валидация входящих метрик
    description: Система должна проверять формат и допустимость входящих метрик.
    actor: Система
    priority: must
    acceptance_criteria:
      - Проверяется наличие обязательных полей.
      - Проверяются типы значений и корректность временной метки.
      - Проверяются ограничения на имена метрик, метки и размер пакета.
      - Невалидные метрики не передаются на дальнейшую обработку.
      - Причина отклонения регистрируется и доступна для диагностики.

  - id: FR-004
    title: Передача исходных метрик на обработку
    description: Система должна надёжно передавать валидные метрики на дальнейшую обработку без содержательного изменения.
    actor: Система
    priority: must
    acceptance_criteria:
      - Каждая принятая валидная метрика становится доступной для дальнейшей обработки.
      - Исходные имя, значение, временная метка и метки сохраняются.
      - Сохраняется возможность определить источник и момент приёма метрики.
      - Ошибка надёжной фиксации не приводит к подтверждению успешного приёма источнику.

  - id: FR-005
    title: Устойчивость к всплескам нагрузки
    description: Система должна буферизовать входящий поток при временном превышении скорости обработки.
    actor: Система
    priority: must
    acceptance_criteria:
      - Принятые данные сохраняются в надёжном буфере до успешной обработки.
      - Замедление последующих этапов не останавливает приём до исчерпания заданной ёмкости буфера.
      - Объём накопленных данных и задержка обработки доступны в технических метриках.
      - При исчерпании ёмкости система ограничивает входящий поток контролируемым способом.

  - id: FR-006
    title: Нормализация метрик
    description: Система должна приводить входящие метрики к единому формату.
    actor: Система
    priority: must
    acceptance_criteria:
      - Имена метрик приводятся к утверждённым правилам именования.
      - Поддерживаемые единицы измерения преобразуются в канонические единицы.
      - Обязательные служебные метки добавляются без удаления исходного контекста.
      - Метрики с ошибками нормализации изолируются для диагностики и повторной обработки.

  - id: FR-007
    title: Агрегация метрик
    description: Система должна рассчитывать агрегированные значения метрик по заданным временным окнам.
    actor: Система
    priority: must
    acceptance_criteria:
      - Для метрики можно настроить одно или несколько окон агрегации.
      - Поддерживаются минимум сумма, количество, среднее, минимум и максимум.
      - Агрегат содержит начало и конец окна, функцию агрегации и набор меток.
      - Повторная обработка одинаковых входных данных не создаёт различные результаты.
      - Рассчитанные агрегаты становятся доступны для хранения, запросов и алертинга.

  - id: FR-008
    title: Вычисление перцентилей
    description: Система должна рассчитывать перцентили для метрик длительности и других распределений.
    actor: Система
    priority: should
    acceptance_criteria:
      - Набор рассчитываемых перцентилей настраивается.
      - Поддерживаются минимум p50, p95 и p99.
      - Результат содержит временное окно и набор меток исходного ряда.

  - id: FR-009
    title: Управление правилами алертинга
    description: Администратор должен иметь возможность создавать и изменять правила алертинга.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Правило определяет метрику, условие, порог и временное окно.
      - Правило можно включить и отключить без удаления.
      - Конфигурация правила валидируется перед применением.
      - Изменения правил сохраняются с указанием времени и автора.

  - id: FR-010
    title: Формирование алертов
    description: Система должна в реальном времени проверять метрики по активным правилам алертинга.
    actor: Система
    priority: must
    acceptance_criteria:
      - Для активного правила вычисляется состояние normal, pending, firing или resolved.
      - При изменении состояния создаётся событие алертинга.
      - Событие содержит идентификатор правила, состояние, время и контекст метрики.
      - События алертинга становятся доступны для доставки и последующей обработки.
      - Повторная обработка не создаёт неконтролируемые дубликаты событий.

  - id: FR-011
    title: Хранение последних значений
    description: Система должна хранить последние значения временных рядов для оперативного доступа.
    actor: Система
    priority: must
    acceptance_criteria:
      - Для каждого временного ряда доступно последнее принятое значение.
      - Вместе со значением сохраняется временная метка измерения.
      - Более старое значение не заменяет уже сохранённое более новое значение.
      - Повторная запись одной метрики не изменяет конечный результат.

  - id: FR-012
    title: Хранение исторических метрик
    description: Система должна хранить исходные и агрегированные метрики для исторического анализа.
    actor: Система
    priority: must
    acceptance_criteria:
      - Сохраняются имя, значение, временная метка, источник и набор меток.
      - Исходные и агрегированные метрики могут быть однозначно различены.
      - Данные доступны для фильтрации по времени, имени метрики и меткам.
      - Повторная доставка сообщения не приводит к неконтролируемому росту дубликатов.

  - id: FR-013
    title: Архивирование метрик
    description: Система должна архивировать данные длительного хранения согласно политике хранения.
    actor: Система
    priority: should
    acceptance_criteria:
      - Период архивирования и срок хранения настраиваются.
      - Архив содержит данные и метаданные, необходимые для последующего чтения.
      - Удаление данных из оперативного хранилища выполняется только после успешного архивирования.
      - Ошибки архивирования регистрируются и допускают повторный запуск.

  - id: FR-014
    title: Получение последних значений
    description: Система должна предоставлять последние значения выбранных метрик через программный интерфейс.
    actor: Пользователь API
    priority: must
    acceptance_criteria:
      - Запрос поддерживает фильтрацию по имени метрики и меткам.
      - Ответ содержит значение, временную метку и набор меток.
      - При отсутствии данных возвращается однозначный результат без подстановки фиктивного значения.
      - Ответ отражает последнее известное системе значение на момент выполнения запроса.

  - id: FR-015
    title: Запрос исторических метрик
    description: Система должна предоставлять исторические значения и агрегаты за выбранный период через программный интерфейс.
    actor: Пользователь API
    priority: must
    acceptance_criteria:
      - Запрос содержит начальную и конечную границы периода.
      - Поддерживается фильтрация по имени метрики, источнику и меткам.
      - Пользователь может выбрать исходные данные или доступную агрегацию.
      - Результаты возвращаются в хронологическом порядке.
      - Для больших результатов поддерживается ограничение объёма или постраничная выдача.

  - id: FR-016
    title: Интеграция с системами визуализации
    description: Система должна предоставлять данные внешним системам визуализации для построения дашбордов.
    actor: Внешняя система визуализации
    priority: must
    acceptance_criteria:
      - Внешняя система может получить временные ряды за указанный период.
      - Запросы поддерживают фильтрацию по меткам.
      - Ответ содержит временные метки и числовые значения в согласованном формате.
      - Ошибки запроса возвращаются в машиночитаемом виде.

  - id: FR-017
    title: Повторная обработка данных
    description: Администратор должен иметь возможность повторно обработать ранее принятые данные.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Можно выбрать данные по временному диапазону и доступным идентификаторам потока.
      - Повторная обработка не требует повторной отправки данных источниками.
      - Прогресс и результат операции доступны администратору.
      - Повторная обработка не приводит к неконтролируемому появлению дубликатов.

  - id: FR-018
    title: Обработка проблемных сообщений
    description: Система должна изолировать данные, которые невозможно обработать автоматически.
    actor: Система
    priority: must
    acceptance_criteria:
      - После заданного числа неуспешных попыток данные помещаются в отдельную область для проблемных данных.
      - Вместе с данными сохраняются причина ошибки и этап обработки.
      - Проблемные данные не блокируют обработку последующих данных.
      - Администратор может повторно направить исправленные данные на обработку.

  - id: FR-019
    title: Контроль состояния конвейера
    description: Администратор должен видеть техническое состояние компонентов и потока обработки.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Компоненты публикуют признаки готовности и работоспособности.
      - Доступны показатели входного потока, ошибок и задержки обработки.
      - Доступны объём очереди и задержка обработки для каждого этапа конвейера.
      - Доступны показатели успешных и неуспешных записей в каждое хранилище.

  - id: FR-020
    title: Аутентификация и авторизация API
    description: Программный интерфейс и административные операции должны быть доступны только аутентифицированным субъектам.
    actor: Пользователь API
    priority: must
    acceptance_criteria:
      - Запрос без действительных учётных данных отклоняется.
      - Права на чтение метрик отделены от прав на изменение конфигурации.
      - Недостаточные права приводят к отказу без раскрытия защищённых данных.
      - Успешные и неуспешные административные операции регистрируются.
