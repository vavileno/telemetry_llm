requirements:
  - id: FR-001
    title: Приём метрик
    description: Система должна принимать системные и прикладные метрики от источников телеметрии.
    actor: Источник телеметрии
    priority: must
    acceptance_criteria:
      - Источник может передать одну метрику или пакет метрик.
      - Каждая метрика содержит имя, числовое значение, временную метку и стабильный measurementId, созданный агентом для этой точки.
      - При повторной отправке измерения агент передаёт тот же measurementId; две разные точки, включая точки с одинаковым временем, имеют разные ID.
      - Метрика может содержать произвольный набор разрешённых меток.
      - Система подтверждает приём только после надёжной фиксации данных.
      - Единица атомарности приёма — отдельная точка с measurementId; в пакете допустим частичный успех без отката других точек.
      - Ответ на разобранный пакет содержит два списка — подтверждённо принятых точек и точек, приём которых не подтверждён; каждая точка пакета входит ровно в один список.
      - Результат каждой точки связывается с её позицией во входном пакете и, если ID корректен, с measurementId; во втором списке указана причина, включая ошибку валидации или неопределённый результат записи.
      - Точка с неопределённым после тайм-аута результатом записи включается во второй список с причиной «статус записи неизвестен» и признаком возможности повтора; это не означает, что она отсутствует в буфере. Агент повторяет её с прежним measurementId.

  - id: FR-002
    title: Идентификация источника
    description: Система должна связывать каждую принятую метрику с её источником.
    actor: Агент
    priority: must
    acceptance_criteria:
      - Для каждой метрики определён идентификатор хоста или микросервиса.
      - Метрика без идентификатора источника отклоняется как невалидная.
      - Идентификатор источника сохраняется при обработке и записи в хранилища.

  - id: FR-003
    title: Валидация входящих метрик
    description: Система должна проверять формат и допустимость входящих метрик.
    actor: Система
    priority: must
    acceptance_criteria:
      - Проверяется наличие обязательных полей.
      - Отсутствующий или некорректный measurementId приводит к отклонению измерения.
      - Проверяются типы значений и корректность временной метки.
      - Проверяются ограничения на имена метрик, метки и размер пакета.
      - Невалидные метрики не передаются на дальнейшую обработку.
      - Ошибка отдельной точки не отменяет приём других валидных точек того же пакета.
      - Причина отклонения регистрируется и доступна для диагностики.

  - id: FR-004
    title: Передача исходных метрик на обработку
    description: Система должна надёжно передавать валидные метрики на дальнейшую обработку без содержательного изменения.
    actor: Система
    priority: must
    acceptance_criteria:
      - Каждая принятая валидная метрика становится доступной для дальнейшей обработки.
      - Исходные имя, значение, временная метка и метки сохраняются.
      - Идентификатор measurementId сохраняется без изменения при передаче на обработку.
      - Сохраняется возможность определить источник и момент приёма метрики.
      - Ошибка надёжной фиксации не приводит к подтверждению успешного приёма источнику.
      - Подтверждение относится к конкретному measurementId, а не ко всему пакету; при неподтверждённой фиксации результат этой точки не объявляется успешным.
      - Подтверждение Kafka не означает, что позднее не будет обнаружен конфликт содержимого по measurementId; такой конфликт регистрируется отдельно и не меняет уже отправленный ответ агенту.

  - id: FR-005
    title: Устойчивость к всплескам нагрузки
    description: Система должна буферизовать входящий поток при временном превышении скорости обработки.
    actor: Система
    priority: must
    acceptance_criteria:
      - Принятые данные сохраняются в надёжном буфере до успешной обработки.
      - Замедление последующих этапов не останавливает приём до исчерпания заданной ёмкости буфера.
      - Объём накопленных данных и задержка обработки доступны в технических метриках.
      - При исчерпании ёмкости система ограничивает входящий поток контролируемым способом.

  - id: FR-006
    title: Нормализация метрик
    description: Система должна приводить входящие метрики к единому формату.
    actor: Система
    priority: must
    acceptance_criteria:
      - Имена метрик приводятся к утверждённым правилам именования.
      - Поддерживаемые единицы измерения преобразуются в канонические единицы.
      - Обязательные служебные метки добавляются без удаления исходного контекста.
      - Метрики с ошибками нормализации изолируются для диагностики и повторной обработки.

  - id: FR-007
    title: Агрегация метрик
    description: Система должна рассчитывать агрегированные значения метрик по заданным временным окнам длительностью 1 минута, 5 минут или 1 час.
    actor: Система
    priority: must
    acceptance_criteria:
      - Для метрики можно настроить одно или несколько окон агрегации из набора 1 минута (60 секунд), 5 минут (300 секунд), 1 час (3600 секунд).
      - Поддерживаются минимум сумма, количество, среднее, минимум и максимум.
      - Для AVG вместе с результатом сохраняется сумма исходных значений и число исходных точек; при объединении агрегатов складываются суммы и количества, а не готовые средние. Для других функций поле суммы отсутствует.
      - Агрегат содержит начало и конец окна, функцию агрегации и набор меток.
      - Повторная обработка одинаковых входных данных не создаёт различные результаты.
      - Рассчитанные агрегаты становятся доступны для хранения, запросов и алертинга.

  - id: FR-008
    title: Вычисление перцентилей
    description: Система должна рассчитывать перцентили для метрик длительности и других распределений.
    actor: Система
    priority: should
    acceptance_criteria:
      - Набор рассчитываемых перцентилей настраивается.
      - Поддерживаются минимум p50, p95 и p99.
      - Результат содержит временное окно и набор меток исходного ряда.

  - id: FR-009
    title: Управление правилами алертинга
    description: Администратор должен иметь возможность создавать и изменять правила алертинга.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Правило определяет метрику, условие, порог и временное окно.
      - Правило можно включить и отключить без удаления.
      - Конфигурация правила валидируется перед применением.
      - Для правила задаётся положительный настраиваемый период подавления повторного срабатывания после ручного сброса.
      - Изменения правил сохраняются с указанием времени и автора.

  - id: FR-010
    title: Формирование алертов
    description: Система должна в реальном времени проверять метрики по активным правилам алертинга.
    actor: Система
    priority: must
    acceptance_criteria:
      - Для активного правила вычисляется состояние normal, pending, firing или resolved.
      - При изменении состояния создаётся событие алертинга.
      - Изменение Alert, создание AlertEvent и запись для его асинхронной публикации сохраняются в одной транзакции PostgreSQL; при ошибке транзакции переход не считается совершённым.
      - AlertEvent.id используется как eventId опубликованного события и не меняется при повторной публикации.
      - Событие содержит идентификатор правила, состояние, время и контекст метрики.
      - События алертинга становятся доступны для доставки и последующей обработки.
      - Повторная обработка не создаёт неконтролируемые дубликаты событий.
      - Конкурирующие изменения одного Alert выполняются последовательно с повторной проверкой состояния перед фиксацией перехода; из одного устаревшего состояния не создаются два события.
      - Отсутствие новых точек само по себе не закрывает алерт и не создаёт событие восстановления.
      - Пока действует период подавления после ручного сброса, автоматическая оценка не зажигает этот алерт повторно; по истечении срока требуется новая обычная оценка.

  - id: FR-011
    title: Хранение последних значений
    description: Система должна хранить последние значения временных рядов для оперативного доступа.
    actor: Система
    priority: must
    acceptance_criteria:
      - Для каждого временного ряда доступно последнее принятое значение.
      - Вместе со значением сохраняется временная метка измерения.
      - Более старое значение не заменяет уже сохранённое более новое значение.
      - Повторная запись одной метрики не изменяет конечный результат.

  - id: FR-012
    title: Хранение исторических метрик
    description: Система должна хранить исходные и агрегированные метрики для исторического анализа.
    actor: Система
    priority: must
    acceptance_criteria:
      - Сохраняются имя, значение, временная метка, источник и набор меток.
      - Идентификатор measurementId сохраняется вместе с исходной исторической точкой.
      - Полные исходные точки хранятся в ClickHouse одни сутки после приёма; после этого доступны из архива MinIO в пределах отдельно заданного срока хранения архива.
      - Два разных measurementId одного ряда с одинаковой временной меткой могут храниться как два измерения.
      - Исходные и агрегированные метрики могут быть однозначно различены.
      - Данные доступны для фильтрации по времени, имени метрики и меткам.
      - Повторная доставка сообщения не приводит к неконтролируемому росту дубликатов.
      - Проверка идентичности и исходного содержимого предшествует записи нового доменного измерения; конфликт по measurementId не заменяет исходную точку и не попадает в исторические результаты.

  - id: FR-013
    title: Архивирование метрик
    description: Система должна архивировать данные длительного хранения согласно политике хранения.
    actor: Система
    priority: must
    acceptance_criteria:
      - Полные исходные точки архивируются в MinIO не позднее окончания суточного окна хранения в ClickHouse; агрегаты архивируются отдельно и не заменяют исходные точки.
      - Архив исходных точек сохраняет measurementId, источник, исходные имя, значение, единицу при наличии, метки, observedAt и receivedAt для чтения и повторной обработки.
      - Срок хранения архива настраивается отдельно от одних суток хранения полных точек в ClickHouse.
      - Удаление исходных точек из ClickHouse допускается только после успешной записи полного архива, проверки полноты и контрольной суммы и подтверждения каталога архива.
      - При сбое архивации или недоступности MinIO исходные точки остаются в ClickHouse сверх суток до успешного архивирования; задержка архивации регистрируется.
      - Ошибки архивирования регистрируются и допускают повторный запуск.

  - id: FR-014
    title: Получение последних значений
    description: Система должна предоставлять последние значения выбранных метрик через программный интерфейс.
    actor: Пользователь API
    priority: must
    acceptance_criteria:
      - Запрос поддерживает фильтрацию по имени метрики и меткам.
      - Ответ содержит значение, временную метку и набор меток.
      - При отсутствии данных возвращается однозначный результат без подстановки фиктивного значения.
      - Ответ отражает последнее известное системе значение на момент выполнения запроса.

  - id: FR-015
    title: Запрос исторических метрик
    description: Система должна предоставлять исторические значения и агрегаты за выбранный период через программный интерфейс.
    actor: Пользователь API
    priority: must
    acceptance_criteria:
      - Запрос содержит начальную и конечную границы периода.
      - Поддерживается фильтрация по имени метрики, источнику и меткам.
      - Пользователь может выбрать исходные данные или доступную агрегацию.
      - Результаты возвращаются в хронологическом порядке.
      - Для больших результатов поддерживается ограничение объёма или постраничная выдача.

  - id: FR-016
    title: Интеграция с системами визуализации
    description: Система должна предоставлять данные внешним системам визуализации для построения дашбордов.
    actor: Внешняя система визуализации
    priority: must
    acceptance_criteria:
      - Внешняя система может получить временные ряды за указанный период.
      - Запросы поддерживают фильтрацию по меткам.
      - Ответ содержит временные метки и числовые значения в согласованном формате.
      - Ошибки запроса возвращаются в машиночитаемом виде.

  - id: FR-017
    title: Повторная обработка данных
    description: Администратор должен иметь возможность повторно обработать ранее принятые данные.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Можно выбрать данные по временному диапазону и доступным идентификаторам потока.
      - Повторная обработка не требует повторной отправки данных источниками.
      - Для диапазона старше суток повторная обработка исходных точек использует архив MinIO с сохранением measurementId, если данные находятся в пределах срока хранения архива.
      - Прогресс и результат операции доступны администратору.
      - Повторная обработка не приводит к неконтролируемому появлению дубликатов.
      - Replay проверяет прежний measurementId и исходное содержимое до создания доменных эффектов; конфликтующая версия изолируется для диагностики.
      - При replay исходный measurementId сохраняется и используется для распознавания повторной обработки точки.
      - Replay исходных метрик не изменяет действующий Alert, не создаёт и не исправляет историю AlertEvent, не публикует повторных алертов.

  - id: FR-018
    title: Обработка проблемных сообщений
    description: Система должна изолировать данные, которые невозможно обработать автоматически.
    actor: Система
    priority: must
    acceptance_criteria:
      - После заданного числа неуспешных попыток данные помещаются в отдельную область для проблемных данных.
      - Вместе с данными сохраняются причина ошибки и этап обработки.
      - Конфликт того же measurementId с другим исходным содержимым изолируется как ProcessingFailure с причиной и ссылкой на точку без автоматических повторов и доступен для диагностики даже после ответа о приёме в Kafka.
      - Проблемные данные не блокируют обработку последующих данных.
      - Администратор может повторно направить исправленные данные на обработку.

  - id: FR-019
    title: Контроль состояния конвейера
    description: Администратор должен видеть техническое состояние компонентов и потока обработки.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Компоненты публикуют признаки готовности и работоспособности.
      - Доступны показатели входного потока, ошибок и задержки обработки.
      - Доступны объём очереди и задержка обработки для каждого этапа конвейера.
      - Доступны показатели успешных и неуспешных записей в каждое хранилище.

  - id: FR-020
    title: Аутентификация и авторизация API
    description: Программный интерфейс и административные операции должны быть доступны только аутентифицированным субъектам.
    actor: Пользователь API
    priority: must
    acceptance_criteria:
      - Запрос без действительных учётных данных отклоняется.
      - Права на чтение метрик отделены от прав на изменение конфигурации.
      - Недостаточные права приводят к отказу без раскрытия защищённых данных.
      - Успешные и неуспешные административные операции регистрируются.

  - id: FR-021
    title: Управляемая регистрация источников телеметрии
    description: Система должна позволять регистрировать источники только аутентифицированным субъектам с административными правами управления источниками.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Регистрация требует непустых externalId и name, а также type из перечня SourceType; attributes необязательны и содержат строковые ключи и значения.
      - Невалидный запрос, запрос без аутентификации или без административных прав отклоняется без изменения источника.
      - Новый источник получает сгенерированный системой id, статус ACTIVE и registeredAt по времени системы; lastSeenAt остаётся пустым до приёма валидных метрик.
      - Повторная регистрация с тем же externalId обновляет name и переданные attributes существующего источника без создания новой записи.
      - Повторная регистрация сохраняет id, externalId, type, status, registeredAt и lastSeenAt; попытка изменить type отклоняется, отсутствие attributes в запросе сохраняет прежние атрибуты.
      - Одновременные регистрации с одинаковым externalId не создают более одного источника.
      - Ответ об успехе выдаётся только после надёжного сохранения записи и содержит идентификатор и текущий статус источника.
      - Успешные и неуспешные попытки регистрации регистрируются с указанием времени, субъекта, externalId при наличии и результата без записи секретов.

  - id: FR-022
    title: Проверка допуска источника при приёме метрик
    description: Система должна принимать метрики только от зарегистрированного источника после проверки права аутентифицированного отправителя передавать данные от его имени.
    actor: Источник телеметрии
    priority: must
    acceptance_criteria:
      - Перед приёмом проверяются существование источника, право отправителя передавать данные от его имени и допустимость текущего статуса по BR-002.
      - Передача метрик с неизвестным идентификатором не регистрирует источник автоматически и отклоняется без подтверждения успешного приёма.
      - Знание идентификатора источника само по себе не даёт права отправлять его метрики; отсутствие соответствующего разрешения приводит к отказу.
      - Для DISABLED приём запрещён; для INACTIVE допустимо только административное исключение по BR-002.
      - Отказ в допуске не меняет статус и lastSeenAt источника; неуспешная попытка регистрируется без раскрытия защищённых данных.

  - id: FR-023
    title: Ручной сброс алерта
    description: Администратор должен иметь возможность вручную завершить сработавший алерт без изменения правила алертинга.
    actor: Администратор системы
    priority: must
    acceptance_criteria:
      - Операция доступна только аутентифицированному субъекту с административным правом управления алертами.
      - Алерт в состоянии FIRING переводится в RESOLVED; изменение правила алертинга для этого не требуется.
      - В той же транзакции устанавливается срок подавления повторного срабатывания данного алерта по настроенному периоду его правила.
      - При успешном переходе создаётся одно событие алертинга с прежним и новым состояниями, временем и идентификатором инициатора в контексте события.
      - До ответа администратору Alert, AlertEvent и запись outbox фиксируются в одной транзакции PostgreSQL; при ошибке транзакции сброс не подтверждается.
      - Успех ручного сброса означает сохранённый переход и поставленное на асинхронную публикацию событие, но не публикацию в Kafka и не доставку внешнему получателю.
      - Перед сохранением сброса под блокировкой строки алерта повторно проверяется его актуальное состояние; конкурирующий автоматический переход не создаёт событие из устаревшего FIRING.
      - Повторный запрос к уже сброшенному алерту не создаёт второго события и не меняет его состояние.
      - Неизвестный алерт, алерт не в состоянии FIRING или отсутствие прав не приводят к изменению состояния и созданию события.
      - Успешные и неуспешные административные попытки регистрируются без раскрытия защищённых данных.
