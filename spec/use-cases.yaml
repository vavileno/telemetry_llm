use_cases:
  - id: UC-001
    name: Приём метрик
    primary_actor: Источник телеметрии
    related_requirements:
      - FR-001
      - FR-002
      - FR-003
      - FR-004
    preconditions:
      - Источник зарегистрирован и имеет право передавать метрики.
      - Формат передачи данных поддерживается системой.
    trigger: Источник отправляет одну метрику или пакет метрик.
    main_flow:
      - Система аутентифицирует источник.
      - Система проверяет структуру и размер запроса.
      - Система проверяет обязательные поля каждой метрики.
      - Система связывает метрики с источником.
      - Система надёжно фиксирует валидные метрики.
      - Система подтверждает успешный приём.
    alternative_flows:
      - condition: Источник не прошёл аутентификацию.
        steps:
          - Система отклоняет запрос.
          - Система регистрирует неуспешную попытку.
      - condition: Часть метрик не прошла валидацию.
        steps:
          - Система не передаёт невалидные метрики на обработку.
          - Система возвращает или регистрирует причины отклонения.
          - Валидные метрики обрабатываются согласно политике пакетного приёма.
      - condition: Система не может надёжно зафиксировать данные.
        steps:
          - Система не подтверждает успешный приём.
          - Источник получает временную ошибку с возможностью повторной отправки.
    postconditions:
      - Валидные метрики доступны для дальнейшей обработки.
      - Отклонённые метрики и причины отклонения учтены.

  - id: UC-002
    name: Получение последних значений
    primary_actor: Пользователь API
    related_requirements:
      - FR-011
      - FR-014
      - FR-020
    preconditions:
      - Пользователь аутентифицирован.
      - Пользователь имеет право читать запрашиваемые метрики.
    trigger: Пользователь запрашивает последние значения метрик.
    main_flow:
      - Пользователь указывает имя метрики и необязательные фильтры по меткам.
      - Система проверяет параметры и права доступа.
      - Система находит последние известные значения подходящих временных рядов.
      - Система возвращает значения, временные метки и наборы меток.
    alternative_flows:
      - condition: Подходящие данные отсутствуют.
        steps:
          - Система возвращает пустой результат.
          - Система не подставляет нулевые или фиктивные значения.
      - condition: Параметры запроса некорректны.
        steps:
          - Система отклоняет запрос.
          - Система сообщает, какие параметры требуют исправления.
      - condition: У пользователя недостаточно прав.
        steps:
          - Система отклоняет запрос без раскрытия защищённых данных.
    postconditions:
      - Состояние данных не изменено.
      - Результат отражает последнее известное состояние на момент запроса.

  - id: UC-003
    name: Запрос исторических данных
    primary_actor: Пользователь API
    related_requirements:
      - FR-007
      - FR-008
      - FR-012
      - FR-015
      - FR-020
    preconditions:
      - Пользователь аутентифицирован.
      - Пользователь имеет право читать запрашиваемые метрики.
    trigger: Пользователь запрашивает метрики за временной период.
    main_flow:
      - Пользователь указывает временной диапазон.
      - Пользователь задаёт имя метрики и фильтры.
      - Пользователь выбирает исходные данные или доступную агрегацию.
      - Система проверяет параметры и права доступа.
      - Система выбирает подходящие временные ряды.
      - Система возвращает данные в хронологическом порядке.
    alternative_flows:
      - condition: Результат превышает допустимый объём.
        steps:
          - Система ограничивает размер ответа.
          - Система предоставляет способ получить следующую часть результата.
      - condition: Запрошенная агрегация недоступна.
        steps:
          - Система возвращает перечень допустимых вариантов.
      - condition: В указанном периоде нет данных.
        steps:
          - Система возвращает пустой результат.
    postconditions:
      - Состояние данных не изменено.
      - Пользователь получил данные либо однозначное описание причины отказа.

  - id: UC-004
    name: Получение данных для дашборда
    primary_actor: Внешняя система визуализации
    related_requirements:
      - FR-014
      - FR-015
      - FR-016
      - FR-020
    preconditions:
      - Внешняя система аутентифицирована.
      - Настроен запрос для одной или нескольких панелей.
    trigger: Внешняя система обновляет дашборд.
    main_flow:
      - Внешняя система передаёт временной диапазон и фильтры.
      - Система проверяет запрос и права доступа.
      - Система получает последние или исторические значения.
      - Система возвращает временные ряды в согласованном формате.
      - Внешняя система отображает полученные данные.
    alternative_flows:
      - condition: Один из запросов панели некорректен.
        steps:
          - Система возвращает машиночитаемую ошибку для этого запроса.
          - Остальные независимые запросы продолжают выполняться.
      - condition: Данные отсутствуют.
        steps:
          - Система возвращает пустой временной ряд.
    postconditions:
      - Дашборд получил доступные данные на момент обновления.
      - Данные системы не изменены.

  - id: UC-005
    name: Настройка правила алертинга
    primary_actor: Администратор системы
    related_requirements:
      - FR-009
      - FR-020
    preconditions:
      - Администратор аутентифицирован.
      - Администратор имеет право управлять правилами алертинга.
    trigger: Администратор создаёт или изменяет правило.
    main_flow:
      - Администратор выбирает метрику и фильтры.
      - Администратор задаёт условие, порог и временное окно.
      - Система проверяет конфигурацию правила.
      - Администратор сохраняет правило.
      - Система регистрирует автора и время изменения.
      - Система применяет правило в выбранном состоянии активности.
    alternative_flows:
      - condition: Конфигурация правила некорректна.
        steps:
          - Система не сохраняет активное правило.
          - Система показывает обнаруженные ошибки.
      - condition: Администратор отключает правило.
        steps:
          - Система прекращает проверку правила.
          - Конфигурация и история правила сохраняются.
    postconditions:
      - Валидное правило сохранено.
      - Активное правило используется для проверки метрик.

  - id: UC-006
    name: Формирование события алертинга
    primary_actor: Система
    supporting_actors:
      - Получатель событий алертинга
    related_requirements:
      - FR-010
    preconditions:
      - Существует активное правило алертинга.
      - Для правила поступили подходящие данные.
    trigger: Результат проверки правила изменяет состояние алерта.
    main_flow:
      - Система вычисляет условие правила для заданного временного окна.
      - Система определяет новое состояние алерта.
      - Система сравнивает новое состояние с предыдущим.
      - Система создаёт событие об изменении состояния.
      - Система добавляет в событие правило, время и контекст метрики.
      - Система делает событие доступным получателям.
    alternative_flows:
      - condition: Состояние алерта не изменилось.
        steps:
          - Система обновляет внутреннее состояние проверки.
          - Новое событие об изменении состояния не создаётся.
      - condition: Данные поступили повторно.
        steps:
          - Система повторяет вычисление.
          - Система не создаёт неконтролируемый дубликат события.
    postconditions:
      - Текущее состояние алерта сохранено.
      - Событие об изменении состояния доступно получателям.

  - id: UC-007
    name: Контроль состояния конвейера
    primary_actor: Администратор системы
    related_requirements:
      - FR-005
      - FR-019
      - FR-020
    preconditions:
      - Администратор аутентифицирован.
      - Компоненты системы публикуют технические показатели.
    trigger: Администратор открывает представление состояния системы.
    main_flow:
      - Система проверяет права администратора.
      - Система показывает состояние компонентов.
      - Система показывает скорость входного потока и количество ошибок.
      - Система показывает объём накопленных данных и задержку обработки.
      - Система показывает результаты операций хранения.
    alternative_flows:
      - condition: От компонента нет актуальных данных о состоянии.
        steps:
          - Система помечает состояние компонента как неизвестное.
          - Система показывает время последнего успешного обновления.
      - condition: Обнаружено превышение эксплуатационного порога.
        steps:
          - Система визуально выделяет отклонение.
          - Администратор получает данные для диагностики.
    postconditions:
      - Администратор получил актуальную картину состояния конвейера.
      - Конфигурация и пользовательские данные не изменены.

  - id: UC-008
    name: Повторная обработка данных
    primary_actor: Администратор системы
    related_requirements:
      - FR-017
      - FR-018
      - FR-020
    preconditions:
      - Администратор аутентифицирован.
      - Администратор имеет право запускать повторную обработку.
      - Исходные данные за требуемый диапазон доступны.
    trigger: Администратор создаёт задание повторной обработки.
    main_flow:
      - Администратор выбирает временной диапазон и идентификаторы данных.
      - Система оценивает доступность и объём выбранных данных.
      - Администратор подтверждает запуск.
      - Система повторно обрабатывает выбранные данные.
      - Система показывает прогресс выполнения.
      - Система завершает задание и предоставляет итог.
    alternative_flows:
      - condition: Часть исходных данных недоступна.
        steps:
          - Система показывает недоступный диапазон.
          - Задание не запускается без явного подтверждения частичной обработки.
      - condition: Отдельные данные не удаётся обработать.
        steps:
          - Система изолирует проблемные данные.
          - Обработка остальных данных продолжается.
          - Итог содержит количество и причины ошибок.
      - condition: Задание прервано отказом компонента.
        steps:
          - Система сохраняет достигнутый прогресс.
          - Администратор может безопасно возобновить задание.
    postconditions:
      - Доступные выбранные данные обработаны повторно.
      - Результаты и ошибки задания зарегистрированы.
      - Неконтролируемые дубликаты результатов не созданы.
