# Структурированная архитектурная модель. Статус proposed у контейнера/связи
# означает проектную декомпозицию, а не утверждённый API или deployment topology.
architecture:
  id: telemetry-platform-architecture
  status: draft
  system: telemetry-platform
  purpose: Границы контейнеров, их внутренних компонентов, владения данными и направлений обмена.
  sources:
    system: spec/system.yaml
    requirements: spec/requirements.yaml
    rules: spec/business-rules.yaml
    domain: spec/domain.yaml
    events: spec/events.yaml
    data_model: spec/database.dbml
    architecture_description: docs/05-architecture.md
    container_diagram: diagrams/containers.mmd
    component_diagram: diagrams/components.mmd
  conventions:
    - Подсистема типа service/worker/adapter — логический контейнер, не обязательно отдельный pod или репозиторий.
    - Связь описывает направление и смысл обмена, но не утверждает HTTP-метод, число Kafka-партиций или сквозную транзакцию.
    - Внутренние компоненты — модули своего контейнера; их взаимодействие не является межсервисным API.
    - Внутренние связи наследуют статус proposed своего контейнера; отдельное утверждение ADR не выводится из наличия стрелки.
    - Принятые решения и остающиеся проектными детали помечаются отдельно; полнота реализации не подразумевается.
    - connections — перечень предложенных взаимодействий, не исчерпывающий allowlist; отсутствие стрелки само по себе не является запретом.
    - Ссылка на принятое ограничение описывает обязательное условие, но не утверждает протокол или маршрут связи со статусом proposed.
  adopted_decisions:
    - adr/0001-architecture-style.md
    - adr/0002-database-choice.md
    - adr/0003-authentication.md
    - adr/0004-event-serialization.md
    - adr/0005-kafka-partition-keys.md
  decision_records:
    ADR-0001: decisions/ADR-0001.yaml
    ADR-0002: decisions/ADR-0002.yaml
    ADR-0003: decisions/ADR-0003.yaml
    ADR-0004: decisions/ADR-0004.yaml
    ADR-0005: decisions/ADR-0005.yaml

  adopted_constraints:
    - id: AC-001
      status: adopted
      sources: [ADR-0003, FR-020, FR-022]
      rule: Внешний приём требует действительного WRITE и допустимого статуса каждого источника; чтение любого слоя и кеша требует READ, при недостоверных правах доступ не предоставляется.
    - id: AC-002
      status: adopted
      sources: [BR-033, BR-011]
      rule: Исходная точка не создаёт историю и другие доменные эффекты до проверки measurementId и исходного содержимого; конфликт изолируется.
    - id: AC-003
      status: adopted
      sources: [BR-010, INV-003]
      rule: Более старое или неподтверждённое SUSPECT-измерение не заменяет latest; повторная запись не должна менять результат.
    - id: AC-004
      status: adopted
      sources: [ADR-0002, BR-031, FR-013]
      rule: Полный raw нельзя удалять из ClickHouse до проверки полноты, checksum и подтверждения каталога RAW_SAMPLES в PostgreSQL.
    - id: AC-005
      status: adopted
      sources: [BR-036, FR-017]
      rule: Replay пересчитывает историю и агрегаты, но не изменяет Alert, AlertEvent и outbox и не публикует алерты из исторических точек.
    - id: AC-006
      status: adopted
      sources: [BR-032, FR-010]
      rule: При переходе Alert, AlertEvent и outbox фиксируются одной транзакцией PostgreSQL; повтор публикации сохраняет eventId.
    - id: AC-007
      status: adopted
      sources: [ADR-0005]
      rule: Логические ключи Kafka определены по типам событий; ключ не гарантирует дедупликацию, а число партиций и кодирование остаются открытыми.
    - id: AC-008
      status: adopted
      sources: [ADR-0004]
      rule: Внутренние Kafka-события используют Avro и Apicurio Registry с BACKWARD_TRANSITIVE; исполняемые схемы и framing ещё не утверждены.
    - id: AC-009
      status: adopted
      sources: [FR-001, FR-004, BR-030]
      rule: Каждая точка подтверждается только после надёжной записи в Kafka; успех других точек пакета не откатывается из-за её отказа.

  dependency_policy:
    scope: proposed_topology_with_adopted_guards
    write_authority:
      status: proposed
      source: spec/data-ownership.yaml
      section: data_ownership.datasets
      rule: Для каждого набора данных предполагаемые писатели указаны в writer и progress_writer; это не утверждает прямой доступ к хранилищу и не заменяет проверку принятых ограничений.
    prohibited_paths:
      - id: DP-001
        status: adopted
        actor: storage_writer
        dataset: raw_history
        operation: write_unchecked_sample
        constraint_ids: [AC-002]
      - id: DP-002
        status: adopted
        actor: replay
        dataset: alert_state_events_outbox
        operation: mutate_or_publish_from_replay
        constraint_ids: [AC-005]
      - id: DP-003
        status: adopted
        actor: query
        datasets: [raw_history, aggregate_history, latest, query_cache, archive_catalog, raw_and_aggregate_archive]
        operation: disclose_without_verified_read
        constraint_ids: [AC-001]
      - id: DP-004
        status: adopted
        actor: archive
        dataset: raw_history
        operation: delete_before_verified_archive
        constraint_ids: [AC-004]
    pending_paths:
      - {connection: consume_raw_history, questions: [EVQ-010], issue: Согласовать доставку проверенного raw в Storage Writer без обхода проверки ID.}
      - {connection: replay_to_processing, questions: [EVQ-011], issue: Выбрать техническую изоляцию replay от live-алертинга.}
      - {connection: publish_normalized_for_alerting, questions: [EVQ-011], issue: Исключить результаты replay из live-оценки.}
      - {connection: publish_aggregates_for_alerting, questions: [EVQ-006, EVQ-011], issue: Утвердить маршрутизацию окон и изоляцию replay.}
    transaction_boundaries:
      - {connection: persist_alert, source: spec/data-ownership.yaml, boundary_id: TX-001, constraint_ids: [AC-006]}
      - {connection: publish_raw, source: spec/data-ownership.yaml, boundary_id: ACK-001, constraint_ids: [AC-009]}
    delivery_details: spec/events.yaml

  access_control:
    decision: adr/0003-authentication.md
    identity_provider: Keycloak
    human_authentication: OIDC Authorization Code with PKCE
    external_agent_authentication: OAuth 2.0 Client Credentials, отдельный короткоживущий токен на агента
    external_transport: TLS
    internal_service_transport: mTLS
    source_permissions: [READ, WRITE]
    grants_system_of_record: postgres
    grant_key: [principalIssuer, principalId, sourceId, permission]
    administration: Административная роль; не предоставляет неявный READ или WRITE на все источники.
    ingest_check: WRITE и допустимый статус для каждого sourceId; устаревший снимок не разрешает приём.
    query_check: READ до чтения любого слоя и кеша; межисточниковый агрегат требует прав на все вошедшие источники.
    targets_pending_verification:
      agent_access_token_lifetime_seconds: 300
      max_snapshot_age_without_confirmation_seconds: 30
      normal_revocation_delay_seconds: 30

  external_participants:
    - id: telemetry-source
      actor_ref: telemetry-source
      role: Агент или источник метрик; создаёт measurementId и передаёт точки.
    - id: operator
      actor_refs: [sre, devops, developer, support, engineering-manager]
      role: Читает метрики, агрегаты и состояние системы.
    - id: system-admin
      actor_ref: system-admin
      role: Управляет источниками, правилами, алертами и replay.
    - id: visualization-system
      actor_ref: visualization-system
      role: Внешние дашборды, включая Grafana через Query Service.
    - id: external-analytics
      actor_ref: external-analytics
      role: Внешние аналитические клиенты Query Service.
    - id: notification-system
      actor_ref: notification-system
      role: Внешняя доставка уведомлений; не часть платформы.
    - id: incident-management
      actor_ref: incident-management
      role: Внешнее управление инцидентами; не часть платформы.

  subsystems:
    - id: ingestion
      name: Ingestion Service
      kind: service
      status: proposed
      responsibility: Авторизованный приём и валидация точек, подтверждение каждой точки после записи в Kafka.
      requirements: [FR-001, FR-002, FR-003, FR-004, FR-005, FR-019, FR-022]
      documentation: docs/services/ingestion.md
      components:
        - {id: receive, responsibility: Разбор пакета и контроль ограничений.}
        - {id: authenticate_source, responsibility: "Проверка отправителя, статуса и права на источник."}
        - {id: validate, responsibility: "Проверка полей, меток и лимитов; результаты по точкам."}
        - {id: publish_raw, responsibility: Публикация MetricAccepted и подтверждение надёжной записи.}
    - id: processing
      name: Processing Service
      kind: service
      status: proposed
      responsibility: Проверка ID и исходного содержимого до доменных эффектов, нормализация, event time и агрегация.
      requirements: [FR-006, FR-007, FR-008, FR-018, FR-019]
      components:
        - {id: identity_check, responsibility: Проверка measurementId и конфликта; устойчивый механизм открыт (EVQ-010).}
        - {id: normalize, responsibility: Нормализация и определение fingerprint временного ряда.}
        - {id: window, responsibility: Оконные расчёты и обработка времени измерения.}
        - {id: quarantine, responsibility: Изоляция ошибок и конфликтующих точек.}
        - {id: publish_processed, responsibility: Публикация проверенных результатов по ключам ряда и группы.}
    - id: alerting
      name: Alerting Service
      kind: service
      status: proposed
      responsibility: Оценка правил на live-данных и сериализованные переходы состояний Alert.
      requirements: [FR-009, FR-010, FR-019, FR-023]
      documentation: docs/services/alerting.md
      components:
        - {id: load_rules, responsibility: Согласованный снимок активных правил.}
        - {id: evaluate, responsibility: "Оценка окон, подавления и переходов только для live-данных."}
        - {id: persist_transition, responsibility: "Сохранение Alert, AlertEvent и outbox одной транзакцией PostgreSQL."}
        - {id: manual_reset, responsibility: Применение авторизованной команды ручного сброса.}
    - id: storage_writer
      name: Storage Writer
      kind: service
      status: proposed
      responsibility: История проверенных raw-точек и агрегатов, условное обновление latest.
      requirements: [FR-011, FR-012, FR-019]
      components:
        - {id: consume_checked, responsibility: Чтение только прошедших проверку ID данных; нельзя обойти BR-033 прямой записью raw.}
        - {id: write_history, responsibility: Пакетная запись истории и агрегатов в ClickHouse.}
        - {id: update_latest, responsibility: Условное обновление Redis по observedAt и качеству.}
    - id: query
      name: Query Service
      kind: service
      status: proposed
      responsibility: Авторизованный доступ к latest, истории и архиву с указанием неполных результатов.
      requirements: [FR-014, FR-015, FR-016, FR-019, FR-020]
      components:
        - {id: validate_query, responsibility: "Проверка прав, диапазона и лимитов результата."}
        - {id: plan, responsibility: Выбор уровня хранения по диапазону и типу данных.}
        - {id: merge, responsibility: "Слияние, сортировка и ограничение результата."}
    - id: control
      name: Control Service
      kind: service
      status: proposed
      responsibility: Управление источниками, определениями, политиками, правилами и заданиями; административный аудит.
      requirements: [FR-009, FR-017, FR-018, FR-019, FR-020, FR-021, FR-023]
      components:
        - {id: authorize_admin, responsibility: Права и аудит административных действий.}
        - {id: manage_config, responsibility: "Управление источниками, метриками, политиками и правилами."}
        - {id: reset_alert, responsibility: Передача авторизованной команды ручного сброса.}
        - {id: manage_jobs, responsibility: Запуск replay и управление проблемными данными.}
    - id: replay
      name: Replay Worker
      kind: worker
      status: proposed
      responsibility: Повторная обработка доступных точек для истории и агрегатов без изменения Alert и AlertEvent.
      requirements: [FR-017, FR-018, FR-019]
      components:
        - {id: select_range, responsibility: Проверка доступности диапазона Kafka или MinIO и прогресс задания.}
        - {id: reprocess, responsibility: Передача исходных точек на повторную обработку с сохранением measurementId.}
    - id: archive
      name: Archive Worker
      kind: worker
      status: proposed
      responsibility: Проверенный архив полного raw и агрегатов; удаление raw из ClickHouse только после подтверждения архива.
      requirements: [FR-013, FR-019]
      components:
        - {id: export, responsibility: Выгрузка исходных точек и агрегатов отдельно.}
        - {id: verify, responsibility: Проверка полноты и checksum.}
        - {id: commit_catalog, responsibility: Подтверждение каталога до разрешения удаления.}
    - id: dispatcher
      name: Event Dispatcher
      kind: worker
      status: proposed
      responsibility: Асинхронная публикация AlertEvent из outbox с неизменным eventId.
      requirements: [FR-010, FR-019, FR-023]
      components:
        - {id: publish_outbox, responsibility: Публикация и повтор после сбоя с тем же AlertEvent.id.}
    - id: external_event_adapter
      name: Адаптер внешних событий
      kind: adapter
      status: proposed
      responsibility: Передача событий алертинга внешним получателям; каналы и обработка инцидентов остаются вне платформы.
      requirements: [FR-010, FR-019]
      components:
        - {id: deliver, responsibility: Интеграция с внешними системами и контроль повторной доставки.}

  infrastructure:
    - {id: kafka, kind: broker, technology: Kafka, responsibility: Надёжный транспорт и ограниченный replay; не постоянное хранилище raw.}
    - {id: postgres, kind: database, technology: PostgreSQL, responsibility: "Конфигурация, Alert, AlertEvent, outbox и операционные метаданные."}
    - {id: redis_latest, kind: database, technology: Redis, responsibility: Последние значения и короткое горячее окно.}
    - {id: redis_cache, kind: cache, technology: Redis, responsibility: Кратковременный кеш запросов.}
    - {id: clickhouse, kind: database, technology: ClickHouse, responsibility: История raw на сутки и агрегаты по политике.}
    - {id: minio, kind: archive, technology: MinIO, responsibility: Архив полного raw и агрегатов в Parquet.}

  observability:
    requirements: [FR-019, NFR-OBS-001, NFR-OBS-002, NFR-OBS-003, NFR-OBS-004]
    applies_to: all_subsystems
    responsibility: Каждый существующий контейнер публикует показатели и состояние своей части конвейера; отсутствие свежих данных показывается как неизвестное, а не как нулевое значение.
    signals: [readiness, liveness, ingest_rate, error_rate, consumer_lag, freshness, outbox_depth, write_failures, unarchived_data_age]
    signal_scope: Каждый контейнер публикует применимые к его ответственности сигналы; consumer_lag и outbox_depth не требуются от контейнера без соответствующего потребителя или outbox.
    pipeline_view: {status: proposed, use_case: UC-007, description: Контроль конвейера использует сигналы существующих контейнеров; отдельный сервис наблюдаемости этой моделью не вводится.}
    source: docs/05-architecture.md

  data_ownership:
    source: spec/data-ownership.yaml
    section: data_ownership.datasets
    status: proposed

  connections:
    - {id: send_metrics, from: telemetry-source, to: ingestion, mode: request, data: Пакет точек с measurementId и ответ по каждой точке, status: proposed, constraint_ids: [AC-001, AC-009]}
    - {id: publish_raw, from: ingestion, to: processing, via: kafka, stream: metrics.raw, event: MetricAccepted, partition_key: measurementId, status: proposed, constraint_ids: [AC-007, AC-008, AC-009]}
    - {id: consume_raw_history, from: ingestion, to: storage_writer, via: kafka, stream: metrics.raw, event: MetricAccepted, status: proposed, constraint_ids: [AC-002, AC-007, AC-008], unresolved: [EVQ-010], constraint: Запись только после проверки BR-033; согласование с Processing открыто (EVQ-010).}
    - {id: publish_normalized_for_storage, from: processing, to: storage_writer, via: kafka, stream: metrics.normalized, event: MetricNormalized, partition_key: timeSeriesFingerprint, status: proposed, constraint_ids: [AC-002, AC-007, AC-008]}
    - {id: publish_normalized_for_alerting, from: processing, to: alerting, via: kafka, stream: metrics.normalized, event: MetricNormalized, partition_key: timeSeriesFingerprint, status: proposed, constraint_ids: [AC-005, AC-007, AC-008], unresolved: [EVQ-011], constraint: Только live-оценка; изоляция replay открыта (EVQ-011).}
    - {id: publish_aggregates_for_storage, from: processing, to: storage_writer, via: kafka, stream: metrics.1m, event: MetricAggregateCalculated, partition_key: Политика и группа агрегации, status: proposed, constraint_ids: [AC-007, AC-008], unresolved: [EVQ-006], constraint: Имя потока проектное; политики допускают окна 1m/5m/1h; маршрутизация открыта (EVQ-006).}
    - {id: publish_aggregates_for_alerting, from: processing, to: alerting, via: kafka, stream: metrics.1m, event: MetricAggregateCalculated, partition_key: Политика и группа агрегации, status: proposed, constraint_ids: [AC-005, AC-007, AC-008], unresolved: [EVQ-006, EVQ-011], constraint: Имя потока проектное; окна 1m/5m/1h; replay исключён по BR-036; маршрутизация и изоляция открыты (EVQ-006, EVQ-011).}
    - {id: persist_history, from: storage_writer, to: clickhouse, mode: batch_write, data: Проверенный raw и агрегаты, status: proposed, constraint_ids: [AC-002]}
    - {id: persist_latest, from: storage_writer, to: redis_latest, mode: conditional_write, data: Последнее валидное значение ряда, status: proposed, constraint_ids: [AC-002, AC-003]}
    - {id: read_configuration_ingestion, from: ingestion, to: postgres, mode: read, data: Источники, статусы, привязки прав и определения метрик, status: proposed, constraint_ids: [AC-001], constraint: Через разрешённый интерфейс или версионированный снимок с ограничением свежести (ADR-0003).}
    - {id: read_grants_query, from: query, to: postgres, mode: read, data: Привязки READ к источникам, status: proposed, constraint_ids: [AC-001], constraint: Через разрешённый интерфейс или снимок; без актуальных прав доступ не предоставляется (ADR-0003).}
    - {id: read_configuration_processing, from: processing, to: postgres, mode: read, data: Политики и определения, status: proposed, constraint: Через разрешённый интерфейс или согласованный снимок.}
    - {id: read_configuration_alerting, from: alerting, to: postgres, mode: read, data: Правила алертинга, status: proposed, constraint: Через разрешённый интерфейс или согласованный снимок.}
    - {id: record_failure, from: processing, to: postgres, mode: write, data: ProcessingFailure для диагностики, status: proposed}
    - {id: manage_configuration, from: control, to: postgres, mode: write, data: Источники, привязки READ/WRITE и правила, status: proposed}
    - {id: reset_alert, from: control, to: alerting, mode: command, data: Авторизованный ручной сброс, status: proposed, constraint_ids: [AC-006]}
    - {id: persist_alert, from: alerting, to: postgres, mode: transaction, data: Alert + AlertEvent + outbox, status: proposed, constraint_ids: [AC-006], invariant: BR-032}
    - {id: read_outbox, from: postgres, to: dispatcher, mode: read, data: AlertEvent и outbox, status: proposed}
    - {id: publish_alert, from: dispatcher, to: external_event_adapter, via: kafka, stream: alerts, event: AlertStateChanged, partition_key: alertId, status: proposed, constraint_ids: [AC-006, AC-007, AC-008]}
    - {id: deliver_notification, from: external_event_adapter, to: notification-system, mode: integration, data: События алертинга, status: proposed}
    - {id: deliver_incident, from: external_event_adapter, to: incident-management, mode: integration, data: События алертинга, status: proposed}
    - {id: query_operator, from: operator, to: query, mode: request, data: Последние и исторические данные, status: proposed, constraint_ids: [AC-001]}
    - {id: query_visualization, from: visualization-system, to: query, mode: request, data: Метрики и агрегаты, status: proposed, constraint_ids: [AC-001]}
    - {id: query_analytics, from: external-analytics, to: query, mode: request, data: Метрики и агрегаты, status: proposed, constraint_ids: [AC-001]}
    - {id: query_latest, from: query, to: redis_latest, mode: read, data: Последнее значение, status: proposed, constraint_ids: [AC-001]}
    - {id: query_cache, from: query, to: redis_cache, mode: read_write, data: Кеш результатов, status: proposed, constraint_ids: [AC-001]}
    - {id: query_history, from: query, to: clickhouse, mode: read, data: История и агрегаты, status: proposed, constraint_ids: [AC-001]}
    - {id: query_archive, from: query, to: minio, mode: read, data: Архивный диапазон, status: proposed, constraint_ids: [AC-001]}
    - {id: administer, from: system-admin, to: control, mode: request, data: Управление и аудит, status: proposed}
    - {id: start_replay, from: control, to: replay, mode: command, data: Задание повторной обработки, status: proposed}
    - {id: replay_from_kafka, from: kafka, to: replay, mode: read, data: Доступный диапазон raw, status: proposed}
