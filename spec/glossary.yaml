# Машиночитаемый глоссарий; человекочитаемое представление: docs/11-glossary.md.
glossary:
  id: telemetry-platform-glossary
  language: ru
  source: docs/11-glossary.md
  terms:
  - id: telemetriya
    term: Телеметрия
    definition: Данные о состоянии и поведении инфраструктуры и приложений, автоматически собираемые и передаваемые
      в систему наблюдаемости.
  - id: metrika
    term: Метрика
    definition: Измеряемый числовой показатель состояния или поведения наблюдаемого объекта; отдельное значение
      метрики в момент времени называется точкой измерения.
  - id: tochka-izmereniya
    term: Точка измерения
    definition: 'Доменная сущность `MetricSample`: отдельное исходное значение метрики с временем измерения и стабильным
      `measurementId`; несколько разных точек могут иметь одинаковое время.'
  - id: sistemnaya-metrika
    term: Системная метрика
    definition: Метрика, описывающая состояние вычислительной инфраструктуры, например использование CPU, RAM, файловой
      системы или сети.
  - id: prikladnaya-metrika
    term: Прикладная метрика
    definition: Метрика, описывающая работу приложения или микросервиса, например latency, RPS, количество ошибок
      или длительность выполнения операции.
  - id: imya-metriki
    term: Имя метрики
    definition: Стабильный идентификатор измеряемого показателя, например `cpu_usage_percent` или `http_request_duration_ms`.
  - id: opredelenie-metriki
    term: Определение метрики
    definition: 'Доменная сущность `MetricDefinition`: имя показателя, тип значения, единица и правила допустимых
      меток; не является отдельной точкой измерения.'
  - id: znachenie-metriki
    term: Значение метрики
    definition: Числовой результат измерения показателя.
  - id: vremennaya-metka
    term: Временная метка
    definition: Дата и время, к которым относится значение метрики; для исходной точки различаются `observedAt`
      и `receivedAt`.
  - id: observedat
    term: observedAt
    definition: Время измерения исходной точки на источнике; не совпадает обязательно с временем её поступления
      в платформу.
  - id: receivedat
    term: receivedAt
    definition: Время приёма исходной точки платформой; от него отсчитываются сутки хранения полного raw в ClickHouse.
  - id: measurementid
    term: measurementId
    definition: Стабильный идентификатор точки, созданный агентом и сохраняемый при повторах и replay. Разные точки
      имеют разные ID, даже если ряд и время совпадают.
  - id: eventid
    term: eventId
    definition: Идентификатор логического события публикации; не заменяет `measurementId`. Для события перехода
      алерта равен неизменному `AlertEvent.id`.
  - id: correlationid
    term: correlationId
    definition: Необязательный идентификатор для связи этапов обработки и диагностики; может быть общим для нескольких
      точек и не используется для их дедупликации.
  - id: metka
    term: Метка
    definition: Пара `ключ=значение`, добавляющая к метрике контекст, например `host=server-01`, `service=payment`
      или `environment=production`.
  - id: nabor-metok
    term: Набор меток
    definition: Совокупность пар `ключ=значение`; вместе с определением метрики и источником задаёт идентичность
      временного ряда.
  - id: vremennoy-ryad
    term: Временной ряд
    definition: 'Доменная сущность `TimeSeries`: последовательность значений одного определения метрики, источника
      и набора нормализованных меток, упорядоченная по времени измерения.'
  - id: timeseriesfingerprint
    term: timeSeriesFingerprint
    definition: Стабильная идентичность ряда из определения метрики, источника и нормализованных меток; не является
      идентификатором отдельной точки.
  - id: kardinalnost
    term: Кардинальность
    definition: Количество уникальных временных рядов. Высокая кардинальность возникает при большом числе уникальных
      комбинаций меток и увеличивает нагрузку на обработку и хранение.
  - id: istochnik-metrik
    term: Источник метрик
    definition: 'Доменная сущность `TelemetrySource`: хост, микросервис, приложение или другой наблюдаемый объект,
      формирующий метрики.'
  - id: sourceid
    term: sourceId
    definition: Идентификатор зарегистрированного источника. Знание `sourceId` само по себе не даёт права отправлять
      или читать его метрики.
  - id: khost
    term: Хост
    definition: Физическая или виртуальная вычислительная машина, с которой собираются системные и прикладные метрики.
  - id: mikroservis
    term: Микросервис
    definition: Самостоятельно развёртываемый программный компонент, выполняющий ограниченный набор бизнес- или
      технических функций.
  - id: agent
    term: Агент
    definition: Компонент, установленный рядом с источником метрик. Он собирает, временно буферизует и отправляет
      метрики в Ingestion Service; назначает точке `measurementId` и сохраняет его при повторе.
  - id: ingestion-service
    term: Ingestion Service
    definition: Сервис приёма точек от агентов. Проверяет отправителя, право `WRITE` на источник и входные данные;
      подтверждает каждую точку после надёжной записи в Kafka.
  - id: raw-metric
    term: Raw Metric
    definition: Полная исходная точка до нормализации и агрегации. Архив raw сохраняет исходное содержание и `measurementId`;
      агрегат не заменяет raw.
  - id: podtverzhdennaya-tochka
    term: Подтверждённая точка
    definition: Точка, для которой Ingestion подтвердил надёжную запись в Kafka; это не подтверждение записи в ClickHouse
      или отсутствия позднее выявленного конфликта.
  - id: neizvestnyy-iskhod-zapisi
    term: Неизвестный исход записи
    definition: Результат приёма точки, для которой после тайм-аута нельзя определить, была ли она записана в Kafka.
      Точка не подтверждается и может быть повторена с тем же `measurementId`.
  - id: normalizatsiya
    term: Нормализация
    definition: Приведение метрик из разных источников к единому формату, соглашениям об именовании и единицам измерения.
  - id: normalizovannaya-tochka
    term: Нормализованная точка
    definition: Результат обработки исходной точки с каноническими именем, единицей и метками; сохраняет `measurementId`
      и не заменяет полный raw.
  - id: processing-service
    term: Processing Service
    definition: 'Сервис потоковой обработки: проверяет идентичность исходных точек, нормализует метрики и рассчитывает
      агрегаты. Оценка правил и переходы алертов принадлежат Alerting Service.'
  - id: alerting-service
    term: Alerting Service
    definition: Сервис оценки правил на live-данных и сохранения переходов состояний алертов; replay исторических
      точек не изменяет алерты.
  - id: agregatsiya
    term: Агрегация
    definition: Вычисление сводного значения по группе точек за временной интервал, например суммы, среднего значения,
      минимума, максимума или перцентиля.
  - id: politika-agregatsii
    term: Политика агрегации
    definition: 'Доменная сущность `AggregationPolicy`: настройка метрики, функций, окна и группировки по меткам для
      расчёта агрегатов; поддерживаемые окна — 1 минута, 5 минут и 1 час.'
  - id: okno-agregatsii
    term: Окно агрегации
    definition: Временной интервал длительностью 1 минута, 5 минут или 1 час, внутри которого значения группы точек
      объединяются для расчёта агрегата; не срок хранения.
  - id: agregirovannaya-metrika
    term: Агрегированная метрика
    definition: 'Доменная сущность `MetricAggregate`: результат агрегации исходных значений за заданное окно и группу
      меток.'
  - id: samplecount
    term: sampleCount
    definition: Положительное число исходных точек, вошедших в расчёт агрегата; есть у каждой функции агрегации.
  - id: sum-dlya-avg
    term: sum для AVG
    definition: 'Сумма исходных значений, сохраняемая только у агрегата `AVG` вместе с `sampleCount`: среднее вычисляется
      как `sum / sampleCount`. У агрегата `SUM` сумма уже находится в `value`.'
  - id: kafka
    term: Kafka
    definition: Распределённая платформа потоковой передачи данных, используемая для надёжной буферизации метрик,
      разделения компонентов и повторной обработки сообщений.
  - id: topik
    term: Топик
    definition: Именованный поток сообщений в Kafka, например поток исходных метрик, агрегированных метрик или событий
      алертинга.
  - id: partitsiya
    term: Партиция
    definition: Упорядоченная часть топика Kafka. Партиции обеспечивают параллельную обработку, а порядок сообщений
      гарантируется только внутри одной партиции.
  - id: smeshchenie
    term: Смещение
    definition: Порядковая позиция сообщения внутри партиции Kafka, используемая для отслеживания прогресса чтения
      и повторной обработки.
  - id: consumer-group
    term: Consumer Group
    definition: Группа потребителей Kafka, совместно обрабатывающих партиции одного топика. Внутри группы каждая
      партиция назначается не более чем одному активному потребителю.
  - id: backpressure
    term: Backpressure
    definition: Состояние, при котором входящий поток данных превышает текущую скорость обработки. Система должна
      поглощать такой разрыв с помощью буферизации и масштабирования.
  - id: pikovaya-nagruzka
    term: Пиковая нагрузка
    definition: Кратковременное существенное увеличение потока метрик, например во время массового развёртывания
      или инцидента.
  - id: storage-writer
    term: Storage Writer
    definition: Контейнер, записывающий проверенную историю и агрегаты в ClickHouse и обновляющий последние значения
      в Redis; raw не записывается до проверки конфликта `measurementId`.
  - id: goryachie-dannye
    term: Горячие данные
    definition: Последние значения и короткое окно приоритетных рядов, доступные с минимальной задержкой через Redis;
      это не полная историческая копия точек.
  - id: poslednee-znachenie
    term: Последнее значение
    definition: Последняя известная системе точка временного ряда с временем измерения; значение обновляется условно
      и не заменяется более старой точкой.
  - id: istoricheskie-dannye
    term: Исторические данные
    definition: Значения метрик за прошедшие периоды, предназначенные для аналитики, визуализации и расследования
      инцидентов. В данной системе полный raw в ClickHouse хранится сутки от `receivedAt` до проверенной архивации;
      сроки хранения агрегатов по окнам ещё не утверждены.
  - id: arkhivnye-dannye
    term: Архивные данные
    definition: 'Данные длительного хранения в MinIO: полный raw и агрегаты архивируются отдельно; точные сроки
      архива пока не установлены.'
  - id: katalog-arkhiva
    term: Каталог архива
    definition: Метаданные архивных объектов и результат их проверки в PostgreSQL; запись каталога сама по себе
      не означает, что raw уже можно удалить из ClickHouse.
  - id: redis
    term: Redis
    definition: Хранилище в памяти, используемое для быстрого доступа к последним значениям метрик и другим оперативным
      данным.
  - id: clickhouse
    term: ClickHouse
    definition: Колоночная аналитическая СУБД, используемая для хранения и выполнения запросов по историческим метрикам.
  - id: minio
    term: MinIO
    definition: S3-совместимое объектное хранилище, используемое для долговременного хранения архивных данных.
  - id: retention
    term: Retention
    definition: Срок хранения данных в конкретном хранилище, после которого они удаляются или переносятся на другой
      уровень хранения; не совпадает с окном агрегации.
  - id: query-service
    term: Query Service
    definition: Сервис, предоставляющий единый API для получения последних, исторических и агрегированных значений
      метрик с проверкой права `READ` на источники.
  - id: grafana
    term: Grafana
    definition: Внешняя система визуализации, обращающаяся к Query Service для построения дашбордов и исследования
      метрик; прямой доступ к хранилищам не предусматривается.
  - id: dashbord
    term: Дашборд
    definition: Набор визуализаций, отображающих состояние инфраструктуры или приложений с помощью метрик.
  - id: alert
    term: Алерт
    definition: Сигнал о том, что метрика или вычисленное условие соответствует потенциально проблемному состоянию.
  - id: pravilo-alertinga
    term: Правило алертинга
    definition: Формализованное условие создания алерта, включающее проверяемую метрику, пороговое значение, временное
      окно и дополнительные ограничения.
  - id: porog
    term: Порог
    definition: Граничное значение, достижение или превышение которого используется в правиле алертинга.
  - id: sobytie-alertinga
    term: Событие алертинга
    definition: Сообщение об изменении состояния алерта, публикуемое для последующей доставки, хранения или интеграции
      с внешними системами.
  - id: sostoyanie-alerta
    term: Состояние алерта
    definition: Текущее состояние результата проверки правила, например `normal`, `pending`, `firing` или `resolved`.
  - id: alertevent
    term: AlertEvent
    definition: Неизменяемая запись фактического перехода состояния алерта; создаётся вместе с изменением `Alert`
      и записью outbox в одной транзакции PostgreSQL.
  - id: outbox
    term: Outbox
    definition: Транзакционно сохранённая запись для последующей публикации `AlertEvent`; повторы публикации используют
      прежний `eventId`.
  - id: latency
    term: Latency
    definition: Время между началом и завершением операции. Для конвейера телеметрии также может означать задержку
      от измерения метрики до её доступности пользователю.
  - id: rps
    term: RPS
    definition: Количество запросов в секунду (`Requests Per Second`), характеризующее интенсивность нагрузки на
      сервис.
  - id: error-rate
    term: Error Rate
    definition: Доля или количество операций, завершившихся ошибкой за заданный интервал.
  - id: pertsentil
    term: Перцентиль
    definition: Значение, ниже которого находится заданная доля измерений. Например, p95 latency означает, что 95
      процентов измерений не превышают это значение.
  - id: propusknaya-sposobnost
    term: Пропускная способность
    definition: Количество метрик или сообщений, которое компонент либо система способны обработать за единицу времени.
  - id: dostupnost
    term: Доступность
    definition: Доля времени, в течение которого система или компонент способны выполнять предусмотренные функции.
  - id: otkazoustoychivost
    term: Отказоустойчивость
    definition: Способность системы продолжать работу при отказе отдельных экземпляров или компонентов без недопустимой
      потери данных.
  - id: replikatsiya
    term: Репликация
    definition: Хранение нескольких копий данных или запуск нескольких экземпляров компонента для повышения доступности
      и устойчивости к отказам.
  - id: dostavka-at-least-once
    term: Доставка At-least-once
    definition: Гарантия, при которой принятое сообщение будет обработано как минимум один раз, но при сбоях возможно
      появление дубликатов.
  - id: dublikat
    term: Дубликат
    definition: Повторно доставленная или записанная копия точки с тем же `measurementId` и исходным содержимым
      либо повтор того же события; конфликт содержимого с тем же ID не считается допустимой заменой.
  - id: idempotentnost
    term: Идемпотентность
    definition: Свойство операции, при котором её повторное выполнение с теми же входными данными не изменяет итоговый
      результат после первого успешного выполнения.
  - id: poterya-dannykh
    term: Потеря данных
    definition: Ситуация, при которой принятая системой метрика становится недоступной для обработки или хранения.
      Отбрасывание невалидной метрики по заданным правилам не считается потерей, но должно быть зарегистрировано.
  - id: dead-letter-queue
    term: Dead Letter Queue
    definition: Возможная область изоляции сообщений, которые не удалось обработать после допустимого числа попыток,
      для диагностики и повторной обработки. Точная топология изоляции ошибок ещё не утверждена.
  - id: povtornaya-obrabotka
    term: Повторная обработка
    definition: Повторная обработка доступного полного raw из Kafka или MinIO для истории и агрегатов с прежним
      `measurementId`, без изменения `Alert`, `AlertEvent` и outbox.
  - id: processingfailure
    term: ProcessingFailure
    definition: Диагностическая запись об ошибке обработки или конфликте того же `measurementId` с другим исходным
      содержимым; конфликт не меняет исходную точку.
  - id: idp
    term: IdP
    definition: Провайдер идентификации, проверяющий личность субъекта и выдающий удостоверение; в проекте эту роль
      выполняет Keycloak.
  - id: keycloak
    term: Keycloak
    definition: Принятый провайдер удостоверений пользователей и внешних машинных агентов; права `READ` и `WRITE`
      на источники хранятся отдельно в PostgreSQL платформы.
  - id: principalid
    term: principalId
    definition: Стабильный идентификатор аутентифицированного субъекта вместе с `issuer`; отображаемое имя не является
      ключом прав доступа.
  - id: read
    term: READ
    definition: Право субъекта читать данные конкретного источника через Query Service; не следует из административной
      роли или права `WRITE`.
  - id: write
    term: WRITE
    definition: Право субъекта отправлять новые точки от имени конкретного источника через Ingestion Service; знание
      `sourceId` права не даёт.
  - id: snimok-prav-i-statusov
    term: Снимок прав и статусов
    definition: Локальная подтверждённая версия разрешений и статусов источников для проверки доступа; после истечения
      допустимого срока без подтверждения актуальности доступ по ней не разрешается. Цель 30 секунд ещё требует
      проверки.
  - id: tls
    term: TLS
    definition: Защищённый канал для внешних соединений с платформой; не заменяет проверку удостоверения и прав
      субъекта.
  - id: mtls
    term: mTLS
    definition: Взаимная проверка сертификатов между внутренними сервисами; для внешних агентов не является обязательной.
  - id: masshtabirovanie
    term: Масштабирование
    definition: Изменение вычислительных ресурсов или количества экземпляров компонента для поддержания требуемой
      производительности.
  - id: nablyudaemost
    term: Наблюдаемость
    definition: Возможность оценивать внутреннее состояние системы по её метрикам, логам и трассировкам. В рамках
      данного продукта основным типом данных являются метрики.
  - id: sli
    term: SLI
    definition: Измеряемый показатель качества работы системы (`Service Level Indicator`), например доступность
      или задержка обработки метрик.
  - id: slo
    term: SLO
    definition: Целевое значение SLI (`Service Level Objective`) за определённый период.
  - id: sla
    term: SLA
    definition: Согласованный уровень сервиса (`Service Level Agreement`), определяющий обязательства по доступности,
      задержкам или сохранности данных.
