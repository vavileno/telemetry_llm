system:
  id: telemetry-platform
  name: Система телеметрии
  version: 0.1.0
  language: ru
  status: draft

  purpose: >
    Централизованный сбор, обработка, хранение, анализ и предоставление
    телеметрии от хостов, микросервисов, приложений и внешних источников.

  business_context:
    scale:
      active_sources: "> 1000"
      normal_ingest_rate: "100000-200000 metrics/sec"
      burst_ingest_rate_target: "up to 400000 metrics/sec for 5 minutes"
    drivers:
      - Метрики не должны теряться после подтверждённого приёма.
      - Последние значения должны быть доступны с минимальной задержкой.
      - Исторические данные должны быть доступны для аналитики и расследований.
      - Алерты должны формироваться в реальном времени.
      - Система должна продолжать работу при отказах отдельных компонентов.
      - Система должна выдерживать всплески нагрузки во время deploy storm и incident.

  scope:
    in_scope:
      - Приём системных и прикладных метрик.
      - Валидация, нормализация и идентификация источников телеметрии.
      - Надёжная передача данных между этапами обработки.
      - Агрегация временных рядов.
      - Формирование событий алертинга.
      - Хранение последних, исторических и архивных данных.
      - API для чтения последних и исторических значений.
      - Интеграция с системами визуализации, уведомлений и аналитики.
      - Повторная обработка ранее принятых данных.
      - Изоляция проблемных данных.
    out_of_scope:
      - Установка и управление жизненным циклом операционных систем на хостах.
      - Развёртывание и оркестрация прикладных сервисов.
      - Автоматическое исправление причин инцидентов.
      - Полноценное управление инцидентами и заявками.
      - Хранение и анализ логов и распределённых трассировок.
      - Управление бизнес-данными наблюдаемых приложений.
      - Замена внешних каналов уведомлений и систем визуализации.

  actors:
    primary:
      - id: telemetry-source
        name: Источник телеметрии
        description: Хост, микросервис, приложение или внешний источник, передающий метрики.
      - id: sre
        name: SRE / инженер эксплуатации
        description: Анализирует текущее состояние, алерты и инциденты.
      - id: devops
        name: DevOps-инженер
        description: Контролирует состояние платформы и инфраструктуры.
      - id: developer
        name: Разработчик
        description: Исследует поведение сервисов по метрикам.
      - id: support
        name: Техническая поддержка
        description: Проверяет состояние сервисов при пользовательских обращениях.
      - id: engineering-manager
        name: Руководитель инженерной команды
        description: Использует дашборды и сводные показатели.
      - id: system-admin
        name: Администратор системы
        description: Управляет источниками, правилами, проблемными данными и повторной обработкой.
    external_systems:
      - id: visualization-system
        name: Система визуализации
      - id: notification-system
        name: Система уведомлений
      - id: external-analytics
        name: Внешняя аналитика
      - id: incident-management
        name: Система управления инцидентами

