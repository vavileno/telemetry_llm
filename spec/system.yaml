  data_flow:
    description: Логический поток обработки телеметрии без фиксации конкретных технологий.
    steps:
      - order: 1
        name: Collection
        description: Источники собирают системные и прикладные метрики.
      - order: 2
        name: Ingestion
        description: Система принимает, аутентифицирует и валидирует входящие данные.
      - order: 3
        name: Durable buffering
        description: Принятые данные надёжно фиксируются и сглаживают всплески нагрузки.
      - order: 4
        name: Processing
        description: Данные нормализуются, агрегируются и проверяются правилами алертинга.
      - order: 5
        name: Storage
        description: Последние, исторические и архивные данные сохраняются согласно политике хранения.
      - order: 6
        name: Query and visualization
        description: Пользователи и внешние системы получают данные через программный интерфейс.
      - order: 7
        name: Alert delivery
        description: События алертинга становятся доступны получателям и внешним системам.

  integrations:
    inbound:
