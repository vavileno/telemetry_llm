entities:
  TelemetrySource:
    description: Наблюдаемый хост, микросервис или другой источник телеметрии.
    fields:
      id:
        type: UUID
      externalId:
        type: string
        required: true
        unique: true
      name:
        type: string
        required: true
      type:
        type: SourceType
        required: true
      status:
        type: SourceStatus
        required: true
      attributes:
        type: map<string, string>
        description: Стабильные характеристики источника, не являющиеся измерениями.
      registeredAt:
        type: datetime
        required: true
      lastSeenAt:
        type: datetime
        nullable: true

  MetricDefinition:
    description: Определение измеряемого показателя и правил его интерпретации.
    fields:
      id:
        type: UUID
      name:
        type: string
        required: true
        unique: true
      displayName:
        type: string
        required: true
      description:
        type: text
        nullable: true
      kind:
        type: MetricKind
        required: true
      valueType:
        type: MetricValueType
        required: true
      unit:
        type: string
        nullable: true
      allowedLabelKeys:
        type: list<string>
        description: Пустой список означает отсутствие дополнительного ограничения.
      status:
        type: DefinitionStatus
        required: true
      createdAt:
        type: datetime
        required: true
      updatedAt:
        type: datetime
        required: true

  TimeSeries:
    description: Уникальный ряд значений одной метрики, источника и набора меток.
    fields:
      id:
        type: UUID
      metricDefinition:
        type: MetricDefinition
        required: true
      source:
        type: TelemetrySource
        required: true
      labels:
        type: map<string, string>
        required: true
      fingerprint:
        type: string
        required: true
        unique: true
        description: Стабильный идентификатор комбинации метрики, источника и меток.
      firstObservedAt:
        type: datetime
        required: true
      lastObservedAt:
        type: datetime
        required: true

  MetricSample:
    description: Отдельное измерение временного ряда; разные точки могут иметь одинаковое время измерения.
    fields:
      id:
        type: UUID
        required: true
        description: Стабильный measurementId, созданный агентом для точки; сохраняется при повторной отправке и replay. Не eventId и не correlationId.
      timeSeries:
        type: TimeSeries
        required: true
      value:
        type: decimal
        required: true
      observedAt:
        type: datetime
        required: true
        description: Время измерения на источнике.
      receivedAt:
        type: datetime
        required: true
        description: Время приёма измерения системой.
      quality:
        type: SampleQuality
        required: true
      correlationId:
        type: string
        nullable: true
        description: Необязательный идентификатор для связывания этапов обработки и диагностики; может быть общим для нескольких измерений. Не определяет идентичность измерения и не служит ключом дедупликации.

  AggregationPolicy:
    description: Правило вычисления сводных значений метрики по временным окнам.
    fields:
      id:
        type: UUID
      metricDefinition:
        type: MetricDefinition
        required: true
      functions:
        type: list<AggregationFunction>
        required: true
      window:
        type: duration
        required: true
        allowedSeconds: [60, 300, 3600]
        description: Поддерживаемые длительности окон агрегации — 1 минута, 5 минут и 1 час; не задают сроки хранения.
      groupByLabels:
        type: list<string>
      status:
        type: PolicyStatus
        required: true
      createdAt:
        type: datetime
        required: true
      updatedAt:
        type: datetime
        required: true

  MetricAggregate:
    description: Сводное значение метрики, рассчитанное за временное окно.
    fields:
      id:
        type: UUID
      policy:
        type: AggregationPolicy
        required: true
      metricDefinition:
        type: MetricDefinition
        required: true
      source:
        type: TelemetrySource
        nullable: true
        description: Может отсутствовать при агрегации по нескольким источникам.
      labels:
        type: map<string, string>
        required: true
      function:
        type: AggregationFunction
        required: true
      value:
        type: decimal
        required: true
      sum:
        type: decimal
        nullable: true
        description: Обязательная сумма исходных значений только для AVG; для остальных функций отсутствует. AVG.value вычисляется из sum и sampleCount.
      sampleCount:
        type: integer
        required: true
      windowStartedAt:
        type: datetime
        required: true
      windowEndedAt:
        type: datetime
        required: true
      calculatedAt:
        type: datetime
        required: true

  AlertRule:
    description: Условие определения потенциально проблемного состояния по метрикам.
    fields:
      id:
        type: UUID
      name:
        type: string
        required: true
        unique: true
      description:
        type: text
        nullable: true
      metricDefinition:
        type: MetricDefinition
        required: true
      labelSelector:
        type: map<string, string>
      aggregationFunction:
        type: AggregationFunction
        nullable: true
      comparison:
        type: ComparisonOperator
        required: true
      threshold:
        type: decimal
        required: true
      evaluationWindow:
        type: duration
        required: true
      pendingPeriod:
        type: duration
        required: true
      manualResetSuppressionPeriod:
        type: duration
        required: true
        description: Настраиваемый положительный период подавления повторного срабатывания после ручного сброса.
      severity:
        type: AlertSeverity
        required: true
      status:
        type: RuleStatus
        required: true
      createdBy:
        type: ActorReference
        required: true
      createdAt:
        type: datetime
        required: true
      updatedAt:
        type: datetime
        required: true

  Alert:
    description: Текущее состояние срабатывания правила для конкретного набора меток.
    fields:
      id:
        type: UUID
      rule:
        type: AlertRule
        required: true
      source:
        type: TelemetrySource
        nullable: true
      labels:
        type: map<string, string>
        required: true
      state:
        type: AlertState
        required: true
      currentValue:
        type: decimal
        nullable: true
      startedAt:
        type: datetime
        required: true
      stateChangedAt:
        type: datetime
        required: true
      resolvedAt:
        type: datetime
        nullable: true
      suppressedUntil:
        type: datetime
        nullable: true
        description: Окончание подавления после ручного сброса, фиксируется в той же транзакции; отсутствие значения означает отсутствие подавления.

  AlertEvent:
    description: Зафиксированный факт изменения состояния алерта.
    fields:
      id:
        type: UUID
      alert:
        type: Alert
        required: true
      previousState:
        type: AlertState
        nullable: true
      newState:
        type: AlertState
        required: true
      value:
        type: decimal
        nullable: true
      occurredAt:
        type: datetime
        required: true
      context:
        type: map<string, string>

  ProcessingFailure:
    description: Данные, которые не удалось обработать автоматически, и контекст ошибки.
    fields:
      id:
        type: UUID
      dataReference:
        type: string
        required: true
      stage:
        type: ProcessingStage
        required: true
      reason:
        type: text
        required: true
      attemptCount:
        type: integer
        required: true
      status:
        type: FailureStatus
        required: true
      firstFailedAt:
        type: datetime
        required: true
      lastFailedAt:
        type: datetime
        required: true
      resolvedAt:
        type: datetime
        nullable: true

  ReplayJob:
    description: Задание на повторную обработку ранее принятых данных.
    fields:
      id:
        type: UUID
      requestedBy:
        type: ActorReference
        required: true
      rangeStartedAt:
        type: datetime
        required: true
      rangeEndedAt:
        type: datetime
        required: true
      dataSelector:
        type: map<string, string>
        description: Критерии выбора данных помимо временного диапазона.
      status:
        type: ReplayJobStatus
        required: true
      processedCount:
        type: integer
        required: true
      failedCount:
        type: integer
        required: true
      requestedAt:
        type: datetime
        required: true
      startedAt:
        type: datetime
        nullable: true
      completedAt:
        type: datetime
        nullable: true

  SourceAccessGrant:
    kind: technical
    description: Привязка субъекта Keycloak к праву READ или WRITE на зарегистрированный источник; владелец — Control Service, источник истины — PostgreSQL (ADR-0003).
    identity: [principalIssuer, principalId, source, permission]
    fields:
      principalIssuer:
        type: string
        required: true
      principalId:
        type: string
        required: true
        description: Стабильный идентификатор субъекта, не отображаемое имя.
      source:
        type: TelemetrySource
        required: true
      permission:
        type: SourceAccessPermission
        required: true
      createdAt:
        type: datetime
        required: true
      updatedAt:
        type: datetime
        required: true

  AlertEventOutbox:
    kind: technical
    description: Запись асинхронной публикации AlertEvent с неизменным eventId; создаётся вместе с Alert и AlertEvent одной транзакцией PostgreSQL (BR-032).
    identity: [alertEvent]
    fields:
      alertEvent:
        type: AlertEvent
        required: true
        description: Идентификатор записи равен AlertEvent.id и eventId публикуемого события.
      payload:
        type: json
        required: true
        description: Неизменяемый снимок события для повторной публикации.
      status:
        type: AlertOutboxStatus
        required: true
      createdAt:
        type: datetime
        required: true
      nextAttemptAt:
        type: datetime
        required: true
      attemptCount:
        type: integer
        required: true
      publishedAt:
        type: datetime
        nullable: true
      lastError:
        type: text
        nullable: true

  ArchiveObject:
    kind: technical
    description: Каталожная запись об объекте raw или агрегатов в MinIO; метаданные и статус проверки принадлежат PostgreSQL (ADR-0002, FR-013), но не являются содержимым объекта.
    fields:
      id:
        type: UUID
      objectKey:
        type: string
        required: true
        unique: true
      dataKind:
        type: ArchiveDataKind
        required: true
      rangeStartedAt:
        type: datetime
        required: true
      rangeEndedAt:
        type: datetime
        required: true
      format:
        type: string
        required: true
      recordCount:
        type: integer
        nullable: true
      sizeBytes:
        type: integer
        nullable: true
      checksum:
        type: string
        required: true
      status:
        type: ArchiveStatus
        required: true
      failureReason:
        type: text
        nullable: true
      createdAt:
        type: datetime
        required: true
      completedAt:
        type: datetime
        nullable: true

# Зависимый объект -> объект ссылки. Кратности описывают связи по полям,
# а не число физических строк в разных хранилищах или правила удаления.
relationships:
  - {from: TimeSeries, field: metricDefinition, to: MetricDefinition, per_from: one, per_to: zero_or_many}
  - {from: TimeSeries, field: source, to: TelemetrySource, per_from: one, per_to: zero_or_many}
  - {from: MetricSample, field: timeSeries, to: TimeSeries, per_from: one, per_to: zero_or_many}
  - {from: AggregationPolicy, field: metricDefinition, to: MetricDefinition, per_from: one, per_to: zero_or_many}
  - {from: MetricAggregate, field: policy, to: AggregationPolicy, per_from: one, per_to: zero_or_many}
  - {from: MetricAggregate, field: metricDefinition, to: MetricDefinition, per_from: one, per_to: zero_or_many}
  - {from: MetricAggregate, field: source, to: TelemetrySource, per_from: zero_or_one, per_to: zero_or_many, note: При нескольких источниках source отсутствует; состав исходных источников пока не моделируется (AQ-008).}
  - {from: AlertRule, field: metricDefinition, to: MetricDefinition, per_from: one, per_to: zero_or_many}
  - {from: Alert, field: rule, to: AlertRule, per_from: one, per_to: zero_or_many}
  - {from: Alert, field: source, to: TelemetrySource, per_from: zero_or_one, per_to: zero_or_many}
  - {from: AlertEvent, field: alert, to: Alert, per_from: one, per_to: zero_or_many}
  - {from: SourceAccessGrant, field: source, to: TelemetrySource, per_from: one, per_to: zero_or_many}
  - {from: AlertEventOutbox, field: alertEvent, to: AlertEvent, per_from: one, per_to: zero_or_one, note: Запись создаётся при переходе, но может быть очищена после публикации; PENDING нельзя удалять без подтверждения.}

modeling_notes:
  - ArchiveObject описывает диапазон и тип данных; прямой связи каталожной записи с каждой исходной точкой или агрегатом нет (FR-013).
  - Redis latest — производная проекция TimeSeries, а не самостоятельная доменная сущность; таблицы-словари DBML реализуют поля map и list.
  - Состав источников межисточникового MetricAggregate остаётся вопросом AQ-008; проверка READ без доказанного состава запрещает выдачу (ADR-0003).

value_objects:
  ActorReference:
    description: Ссылка на пользователя или внешний субъект, выполнивший действие.
    fields:
      id:
        type: string
        required: true
      type:
        type: ActorType
        required: true
      displayName:
        type: string
        nullable: true

enums:
  SourceAccessPermission:
    - READ
    - WRITE

  AlertOutboxStatus:
    - PENDING
    - PUBLISHED

  ArchiveStatus:
    - PENDING
    - COMPLETED
    - FAILED

  ArchiveDataKind:
    - RAW_SAMPLES
    - AGGREGATES

  SourceType:
    - HOST
    - MICROSERVICE
    - APPLICATION
    - EXTERNAL_SYSTEM

  SourceStatus:
    - ACTIVE
    - INACTIVE
    - DISABLED

  MetricKind:
    - SYSTEM
    - APPLICATION
    - PLATFORM

  MetricValueType:
    - GAUGE
    - COUNTER
    - HISTOGRAM

  DefinitionStatus:
    - ACTIVE
    - DEPRECATED
    - DISABLED

  SampleQuality:
    - VALID
    - LATE
    - SUSPECT

  AggregationFunction:
    - COUNT
    - SUM
    - AVG
    - MIN
    - MAX
    - P50
    - P95
    - P99

  PolicyStatus:
    - ACTIVE
    - DISABLED

  ComparisonOperator:
    - GREATER_THAN
    - GREATER_THAN_OR_EQUAL
    - LESS_THAN
    - LESS_THAN_OR_EQUAL
    - EQUAL
    - NOT_EQUAL

  AlertSeverity:
    - INFO
    - WARNING
    - CRITICAL

  RuleStatus:
    - ACTIVE
    - DISABLED

  AlertState:
    - NORMAL
    - PENDING
    - FIRING
    - RESOLVED

  ActorType:
    - USER
    - SERVICE
    - EXTERNAL_SYSTEM

  ProcessingStage:
    - INGESTION
    - VALIDATION
    - NORMALIZATION
    - AGGREGATION
    - ALERT_EVALUATION
    - PERSISTENCE

  FailureStatus:
    - OPEN
    - RETRYING
    - RESOLVED
    - IGNORED

  ReplayJobStatus:
    - PENDING
    - RUNNING
    - COMPLETED
    - COMPLETED_WITH_ERRORS
    - FAILED
    - CANCELLED

invariants:
  - id: INV-001
    description: Временной ряд однозначно определяется метрикой, источником и набором меток.
    applies_to: [TimeSeries, MetricDefinition, TelemetrySource]
    rules: [BR-009]
  - id: INV-002
    description: Время начала любого временного диапазона должно предшествовать времени его окончания.
    applies_to: [MetricAggregate, ReplayJob, ArchiveObject]
    rules: [BR-012]
  - id: INV-003
    description: Более старое измерение не может заменить последнее известное значение временного ряда.
    applies_to: [TimeSeries, MetricSample]
    rules: [BR-010]
  - id: INV-004
    description: Событие алертинга создаётся только при изменении состояния алерта.
    applies_to: [Alert, AlertEvent, AlertEventOutbox]
    rules: [BR-018, BR-032]
  - id: INV-005
    description: Завершённое задание повторной обработки имеет время завершения.
    applies_to: [ReplayJob]
  - id: INV-006
    description: Неактивное правило алертинга не участвует в вычислении состояния алертов.
    applies_to: [AlertRule, Alert]
    rules: [BR-016]
  - id: INV-007
    description: Полный raw не удаляется из ClickHouse до проверки полноты, checksum и каталога соответствующего RAW_SAMPLES-архива.
    applies_to: [MetricSample, ArchiveObject]
    rules: [BR-031]
  - id: INV-008
    description: Alert, неизменяемый AlertEvent и запись outbox при переходе сохраняются в одной транзакции PostgreSQL с общим eventId.
    applies_to: [Alert, AlertEvent, AlertEventOutbox]
    rules: [BR-032]
